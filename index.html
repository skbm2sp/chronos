ked beak. Its relatives lived only in South America before. What event let it reach North America?", "a": ["The formation of the Isthmus of Panama", "The formation of Pangaea", "The opening of the Atlantic Ocean", "The Bering Land Bridge"], "why": "This describes Titanis, a terror bird.", "div": "cenozoic"}, {"q": "Rocks formed just after the dinosaur extinction contain a tiny mammal weighing about 37 g. Its ankle bones show it climbed trees. What is it most likely?", "a": ["Purgatorius, an early primate relative", "Eomaia, an early placental relative", "Pakicetus, an early whale relative", "Brasilodon, an early mammal"], "why": "Purgatorius appeared shortly after the dinosaurs died out.", "div": "cenozoic"}, {"q": "Paleogene rocks in Europe contain a flightless bird about 2 m tall with a huge beak. New studies suggest it ate mainly plants. What is it most likely?", "a": ["Gastornis", "Titanis", "Archaeopteryx", "Pteranodon"], "why": "Gastornis lived in Europe, North America and Asia.", "div": "cenozoic"}, {"q": "In the Americas, scientists find a cat skull about 20,000 years old with canine teeth about 28 cm long. What is it most likely?", "a": ["Smilodon, a saber-toothed cat that ambushed large animals", "A lion", "Megalodon", "Biarmosuchus"], "why": "Smilodon lived in the Americas until about 10,000 years ago.", "div": "cenozoic"}, {"q": "In East Africa, scientists find a skull about 2 million years old with a brain larger than that of Australopithecus. Simple stone tools and butchered animal bones lie nearby. Which hominin is it most likely?", "a": ["Homo habilis", "Lucy (Australopithecus afarensis)", "Homo neanderthalensis", "Homo sapiens"], "why": "Homo habilis used stone tools to butcher meat.", "div": "cenozoic"}, {"q": "In a European cave about 60,000 years old, scientists find a skeleton with a stocky body, short and thick limb bones, a protruding face and a large nasal cavity. It was carefully buried. Which hominin is it?", "a": ["Homo neanderthalensis (a Neanderthal)", "Homo erectus", "Australopithecus", "Homo habilis"], "why": "Neanderthals buried their dead.", "div": "cenozoic"}, {"q": "Fossils of the same species of ice age mammal are found in Siberia and in Alaska, which are now separated by sea. What best explains this?", "a": ["Animals migrated across the Bering Land Bridge when sea levels were low", "The animals swam across the ocean", "Siberia and Alaska were part of Pangaea at that time", "Birds carried the fossils"], "why": "The land bridge connected Asia and North America.", "div": "cenozoic"}, {"q": "In Northern Europe, geologists find scratched bedrock and huge boulders far from where they formed, in deposits less than 2.6 million years old. What do these features record?", "a": ["The Pleistocene glaciation, when ice sheets covered Northern Europe", "The Cambrian explosion", "The K–Pg asteroid impact", "The formation of Pangaea"], "why": "Moving ice sheets scratch rock and carry boulders.", "div": "cenozoic"}, {"q": "South American layers contain bones of a giant ground sloth up to 6 m long. The youngest bones are about 12,000 years old and lie near human hunting tools. What does this evidence support?", "a": ["The Pleistocene extinction, caused by overhunting and abrupt climate change", "The K–Pg extinction", "The Great Dying", "The Ordovician extinction"], "why": "This describes Megatherium.", "div": "cenozoic"}, {"q": "Neogene rock layers show more and more grass fossils over time, along with more fossils of grazing mammals with teeth for tough grass. What best explains this pattern?", "a": ["Global cooling spread grasslands, and grazing mammals diversified", "Global warming spread swamp forests", "An asteroid destroyed all forests", "Grazing mammals planted the grass"], "why": "Grazing mammals, like relatives of cows and sheep, diversified.", "div": "cenozoic"}, {"q": "In a cave, older layers contain only Neanderthal tools. Layers from after about 40,000 years ago contain only Homo sapiens tools. W uts slowly broke down the tough plant material."}]}, "cretaceous": {"main": ["From the Latin creta, \"**chalk**\": thick chalk layers formed in warm seas.", "The oldest widely accepted flowering plant fossils appear; flowering plants diversified and spread.", "Famous dinosaurs such as T. rex, Triceratops and Velociraptor lived near its end.", "Early birds and mammals diversified.", "Ended with the **K–Pg extinction** 66 million years ago, when an asteroid struck Chicxulub, Mexico: non-avian dinosaurs, pterosaurs and large marine reptiles went extinct."], "poes": ["From the Latin creta, \"**chalk**\": thick chalk layers formed in warm seas.", "Pangaea broke apart.", "Flowering plants diversified; modern insects appeared.", "Dinosaurs continued to flourish; birds diversified, slowly replacing flying reptiles.", "Mammals diversified into three groups: monotremes, marsupials and placentals.", {"t": "**K–Pg extinction** (66 mya):", "sub": ["A 10–20 km asteroid hit the Yucatán Peninsula, forming the Chicxulub crater.", "Debris ejected into the atmosphere blocked sunlight and caused drastic climate change.", "About three-quarters of all plant and animal species went extinct."]}], "think": [{"q": "What characteristics helped some organisms survive the K–Pg extinction?", "a": "Small body size, sheltering behavior (burrowing, living in water) and a low-metabolism diet that needed little food helped them survive when food chains collapsed."}, {"q": "How could an asteroid that hit Mexico cause extinctions worldwide?", "a": "Dust and debris blocked sunlight around the globe, so plants stopped growing, temperatures changed, and food chains collapsed everywhere."}]}, "paleogene": {"main": ["Means \"**ancient born**\".", "Mammals diversified quickly after the dinosaurs died out.", "Early primates, horses and whale ancestors appeared.", "Large flightless birds such as Gastornis lived on land.", "A very warm period (about 56 million years ago) was followed by cooling; ice began formi sed by changes in Earth's orbit (more oval ↔ more circular), which change the solar radiation Earth receives.", "Lower greenhouse gases (carbon dioxide and methane) also cooled the planet."]}, "The **Bering Land Bridge** connected Asia and North America, allowing plants and animals to migrate.", {"t": "The **Pleistocene extinction** (about 12,000–10,000 years ago):", "sub": ["About **65% of all megafauna** disappeared.", "Most likely caused by a combination of **overhunting** of large herbivores and **abrupt climate change**."]}], "think": [{"q": "Why does a lower concentration of greenhouse gases cause glaciation?", "a": "Greenhouse gases trap heat. With less of them, more heat escapes to space, Earth cools, and ice sheets can grow."}, {"q": "How did the Bering Land Bridge affect animal populations?", "a": "It let animals (and later humans) migrate between Asia and North America. When sea levels rose, it disappeared and isolated those populations."}]}};

      e.preventDefault(); e.stopPropagation();
      stopPlay(); if (animId) { cancelAnimationFrame(animId); animId = null; }
      drag = { hand: h.dataset.hand, last: pointerAngle(e), id: e.pointerId };
      dragMoved = false;
      svg.setPointerCapture(e.pointerId);
      svg.classList.add("dragging");
    }));
    svg.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id) return;
      const a = pointerAngle(e);
      let delta = a - drag.last; if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
      drag.last = a; if (Math.abs(delta) > 0.01) dragMoved = true;
      const perDeg = drag.hand === "hour" ? DAY / 360 : 3600 / 360;
      travelTo(curSec + delta * perDeg, false);
    });
    const end = e => {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      drag = null; svg.classList.remove("dragging");
      travelTo(curSec, true);
      setTimeout(() => { dragMoved = false; }, 0);
    };
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", end);
    svg.addEventListener("keydown", e => {
      const step = { ArrowRight: 60, ArrowUp: 60, ArrowLeft: -60, ArrowDown: -60, PageUp: 3600, PageDown: -3600 }[e.key];
      if (step === undefined && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault(); stopPlay(); if (animId) { cancelAnimationFrame(animId); animId = null; }
      if (e.key === "Home") return travelTo(0, true);
      if (e.key === "End") return travelTo(DAY - 1, true);
      travelTo(curSec + step * (e.shiftKey ? 60 : 1), true);
    });
  }

  /* play through Earth's day */
  let playId = null;
  function startPlay() {
    if (curSec >= DAY - 1) curSec = 0;
    state.playing = true; $("#playBtn").textContent = "❚❚ Pause"; $("#playBtn").setAttribute("aria-label", "Pause");
    if (state.view !== "division") showDivision(divisionAtSec(curSec).id, { keepHands: true });
    let last = performance.now();
    const PH = C.toClock(542);
    (function step(now) {
      const dt = (now - last) / 1000; last = now;
      const rate = curSec < PH ? PH / 30 : (86400 - PH) / 25;   // Precambrian in 30 s, Phanerozoic in 25 s
      curSec = Math.min(86400, curSec + dt * rate);
      drawHands(curSec);
      const d = divisionAtSec(curSec);
      if (d.id !== state.div) showDivision(d.id, { keepHands: true, noHash: true });
      if (curSec >= 86400) { stopPlay(); return; }
      playId = requestAnimationFrame(step);
    })(last);
  }
  function stopPlay() {
    if (playId) cancelAnimationFrame(playId);
    playId = null; state.playing = false;
    $("#playBtn").textContent = "▶ Play Earth's day"; $("#playBtn").setAttribute("aria-label", "Play Earth's history");
  }

  /* ================= NAV ================= */
  function buildMega() {
    let h = "";
    ["paleozoic", "mesozoic", "cenozoic"].forEach(eid => {
      const e = C.byId[eid];
      h += `<div><h4><button type="button" data-go="${eid}">${esc(e.name)} Era</button></h4><ul>`;
      e.children.forEach(pid => {
        const p = C.byId[pid];
        h += `<li><button type="button" data-go="${pid}"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}<span class="when">${esc(C.rangeLabel(p))}</span></button></li>`;
      });
      h += `</ul></div>`;
    });
    $("#mega").innerHTML = h;
  }
  function toggleMega(open) {
    const m = $("#mega"), b = $("#phanBtn");
    const willOpen = open === undefined ? m.hidden : open;
    m.hidden = !willOpen; b.setAttribute("aria-expanded", String(willOpen));
  }
  function setNavActive() {
    let key;
    if (state.view === "quiz") key = "quiz";
    else if (state.view === "references") key = "references";
    else {
      const id = state.view === "organisms" ? state.org.scope : state.div;
      key = id === "all" ? null : C.lineage(id)[0].id;
    }
    $$(".main-nav .nav-btn").forEach(b => b.classList.toggle("active", b.dataset.go === key));
  }
  function buildLegend() {
    $("#legend").innerHTML = ["hadean", "archean", "proterozoic", "paleozoic", "mesozoic", "cenozoic"].map(id => {
      const d = C.byId[id];
      return `<button type="button" data-go="${id}"><span class="swatch" style="background:${d.color}"></span>${esc(d.name)}</button>`;
    }).join("");
  }

  /* ================= ROUTING ================= */
  let lastHash = "";
  function setHash(h) { lastHash = "#" + h; if (location.hash !== lastHash) { try { location.hash = h; } catch (e) { /* ignore */ } } }
  function go(target) {
    toggleMega(false);
    if (target === "quiz") return showQuiz();
    if (target === "references") return showReferences();
    if (C.byId[target]) return showDivision(target);
  }
  function route() {
    const h = location.hash.replace(/^#/, "");
    if (("#" + h) === lastHash) return;
    lastHash = "#" + h;
    if (h === "quiz") return showQuiz(true);
    if (h === "references") return showReferences(true);
    if (h.startsWith("orgs-") && (h.slice(5) === "all" || C.byId[h.slice(5)])) return showOrganisms(h.slice(5), null, true);
    if (h.startsWith("org-") && C.orgById[h.slice(4)]) {
      const o = C.orgById[h.slice(4)];
      return showOrganisms(o.home, o.id, true);
    }
    showDivision(C.byId[h] ? h : "hadean", { noHash: true });
  }

  /* ================= DIVISION VIEW ================= */
  function sameRankList(d) {
    if (d.rank === "eon") return C.eons;
    if (d.rank === "era") return ["paleozoic", "mesozoic", "cenozoic"];
    return C.periods;
  }
  function clockSpan(s) {
    s = Math.round(s);
    if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + " h " + m + " min"; }
    if (s >= 60) { const m = Math.floor(s / 60), r = s % 60; return m + " min" + (r ? " " + r + " s" : ""); }
    return s + " seconds";
  }
  // Escape text, then turn **term** into bold (used for definitions)
  /* **bold**, *italic*, ***both***: each run of asterisks toggles bold (2), italic (1) or both (3) */
  const rich = (t) => {
    const s = String(t); let out = "", b = false, i = false, k = 0;
    const open = () => (b ? "<strong>" : "") + (i ? "<em>" : ""), close = () => (i ? "</em>" : "") + (b ? "</strong>" : "");
    while (k < s.length) {
      if (s[k] === "*") {
        let j = k; while (j < s.length && s[j] === "*") j++;
        const n = j - k; out += close();
        if (n === 3) { b = !b; i = !i; } else if (n === 1) i = !i; else { if ((n >> 1) % 2) b = !b; if (n % 2) i = !i; }
        out += open(); k = j; continue;
      }
      let j = k; while (j < s.length && s[j] !== "*") j++;
      out += esc(s.slice(k, j)); k = j;
    }
    return out + close();
  };
  const bulletItem = (b) => typeof b === "string" ? `<li>${rich(b)}</li>` : `<li>${rich(b.t)}<ul>${b.sub.map(bulletItem).join("")}</ul></li>`;
  function bulletsHtml(list) { return `<ul class="bullets">` + list.map(bulletItem).join("") + `</ul>`; }
  const orgName = (o, upper) => { const n = esc(upper ? o.name.toUpperCase() : o.name); return o.italic ? `<em>${n}</em>` : n; };
  const isPoes = () => state.mode === "poes";
  // Lesson-slide labels apply to POES only; for Mainstream every organism counts as "Added"
  const srcOf = (o) => isPoes() ? o.source : "added";
  function thinkHtml(list) {
    if (!isPoes() || !list || !list.length) return "";
    return `<div class="sub-head">Think deeper <span class="hots">HOTS</span></div><div class="think-list">` +
      list.map(t => `<details class="think"><summary>${rich(t.q)}</summary><p>${rich(t.a)}</p></details>`).join("") + `</div>`;
  }
  function modeChip() {
    return `<span class="chip mode-chip ${state.mode}">${isPoes() ? "POES content" : "Mainstream content"}</span>`;
  }
  function photosHtml(d) {
    return `<div class="photos">` + d.photos.map((p, i) => `<figure class="ph"><button type="button" class="ph-box zoomable" data-zoom="img/full/${d.id}-${i + 1}.jpg" data-cap="${esc(p.caption)}" aria-label="Enlarge photo: ${esc(p.caption)}"><img src="${__R(`img/${d.id}-${i + 1}.jpg`)}" data-isrc="img/${d.id}-${i + 1}.jpg" alt="${esc(p.caption)}" loading="lazy" width="800" height="600"></button>
      <figcaption>${esc(p.caption)} · <a href="${wikiUrl(p.wiki)}" target="_blank" rel="noopener">learn more ↗</a></figcaption></figure>`).join("") + `</div>`;
  }

  function showDivision(id, opts) {
    opts = opts || {};
    const d = C.byId[id];
    state.view = "division"; state.div = id;
    if (!opts.keepHands) { stopPlay(); moveHands(C.toClock(d.start)); }
    highlight(id, [d.start, d.end]);
    if (!opts.noHash) setHash(id);
    setNavActive();

    const s1 = C.toClock(d.start), s2 = C.toClock(d.end);
    const orgs = C.organismsFor(id);
    const lin = C.lineage(id);
    const rankWord = d.rank.charAt(0).toUpperCase() + d.rank.slice(1);
    let h = "";
    if (lin.length > 1) h += `<div class="crumbs">` + lin.map((x, i) => i < lin.length - 1 ? `<button type="button" data-go="${x.id}">${esc(x.name)}</button> ›` : `<span>${esc(x.name)}</span>`).join(" ") + `</div>`;
    h += `<div class="top-row"><div class="clock-range">${esc(C.formatClock(s1))} – ${esc(C.formatClock(s2))}</div>`;
    h += orgs.length ? `<button type="button" class="pill" data-orgs="${id}">Check the organisms ▸ <span aria-hidden="true">(${orgs.length})</span></button>`
                     : `<button type="button" class="pill" disabled title="No fossils of life are known from this eon">No organisms yet</button>`;
    h += `</div>`;
    h += `<h2 class="div-title">${esc(d.name.toUpperCase())} ${esc(rankWord.toUpperCase())}<small>(${esc(C.rangeLabel(d))})</small></h2>`;
    h += `<div class="meta">${modeChip()}<span class="chip">Lasted ≈ ${esc(C.formatDuration(d.start - d.end))}${d.end === 0 ? " (ongoing)" : ""}</span><span class="chip">On the clock: ${esc(clockSpan(s2 - s1))}</span></div>`;
    const pd = isPoes() ? C.poesDivisions[id] : null;
    h += bulletsHtml(pd ? pd.bullets : d.bullets);
    if (pd) h += thinkHtml(pd.think);
    if (d.children.length) {
      h += `<div class="sub-head">${d.rank === "eon" ? "Eras" : "Periods"} in this ${d.rank}</div><div class="children">` +
        d.children.map(cid => { const c = C.byId[cid]; return `<button type="button" class="child-btn" data-go="${cid}"><span class="swatch" style="background:${c.color}"></span>${esc(c.name)} <span class="when">${esc(C.rangeLabel(c))}</span></button>`; }).join("") + `</div>`;
    }
    h += `<div class="sub-head">Photos</div>` + photosHtml(d);
    const list = sameRankList(d), i = list.indexOf(id);
    const prev = list[i - 1] ? C.byId[list[i - 1]] : null, next = list[i + 1] ? C.byId[list[i + 1]] : null;
    h += `<div class="stepper"><button type="button" ${prev ? `data-go="${prev.id}"` : "disabled"}>◂ ${prev ? esc(prev.name) : "Earlier"}</button><button type="button" ${next ? `data-go="${next.id}"` : "disabled"}>${next ? esc(next.name) : "Later"} ▸</button></div>`;
    const body = $("#panelBody");
    body.classList.remove("org-mode");
    body.innerHTML = h; if (!opts.keepScroll) body.scrollTop = 0;
  }

  /* ================= ORGANISM VIEW ================= */
  const initials = (n) => { const w = n.replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean); return w.length > 1 ? w[0][0].toUpperCase() + w[1][0].toLowerCase() : n.slice(0, 2); };
  const tint = (hex) => hex + "55";

  function scopeOptions(sel) {
    let h = `<option value="all"${sel === "all" ? " selected" : ""}>All of Earth's history</option>`;
    const add = (id, depth) => {
      const d = C.byId[id];
      if (id !== "hadean") h += `<option value="${id}"${sel === id ? " selected" : ""}>${" ".repeat(depth)}${esc(d.name)} ${esc(d.rank)}</option>`;
      d.children.forEach(c => add(c, depth + 1));
    };
    C.eons.forEach(e => add(e, 0));
    return h;
  }

  /* Pokédex-style numbering: every organism gets a fixed number in order of first appearance. */
  const DEX_NO = {};
  C.organisms.slice().sort((x, y) => y.range[0] - x.range[0] || x.name.localeCompare(y.name)).forEach((o, i) => { DEX_NO[o.id] = i + 1; });
  const dexNo = (o) => "No. " + String(DEX_NO[o.id]).padStart(3, "0");

  function showOrganisms(scope, selected, fromRoute) {
    stopPlay();
    state.view = "organisms";
    state.org.scope = scope; state.org.q = ""; state.org.filter = "all"; state.org.selected = selected || null; state.org.sort = "az";
    setNavActive();
    const body = $("#panelBody");
    body.classList.remove("org-mode");
    body.innerHTML = `<div id="orgMain"></div>`;
    renderOrgMain(fromRoute);
  }
  /* Sort menu: "From lessons" and "Added" (POES only) show just those organisms, A to Z */
  const SORTS = [{ v: "az", label: "A to Z" }, { v: "no", label: "No. (oldest to youngest)" },
    { v: "lesson", label: "From lessons (A to Z)", poes: true }, { v: "added", label: "Added (A to Z)", poes: true }];
  function orgToolbar() {
    const o = state.org;
    return `<div class="org-toolbar dex-toolbar">
        <label class="search"><span aria-hidden="true">🔍</span><input id="orgSearch" type="search" placeholder="Search…" aria-label="Search all organisms" value="${esc(o.q)}"></label>
        <select id="orgScope" aria-label="Browse by period">${scopeOptions(o.scope)}</select>
        <label class="sort-pick"><span>Sort:</span><select id="orgSort" aria-label="Sort organisms">
          ${SORTS.filter(x => isPoes() || !x.poes).map(x => `<option value="${x.v}"${o.sort === x.v ? " selected" : ""}>${x.label}</option>`).join("")}
        </select></label>
        <button type="button" class="pill back-btn" data-go="${o.scope === "all" ? state.div : o.scope}">◂ Go back</button>
      </div>`;
  }
  function wireToolbar(main) {
    const s = $("#orgSearch", main);
    s.addEventListener("input", e => { state.org.q = e.target.value.trim(); renderDexGrid(); });
    $("#orgScope", main).addEventListener("change", e => { state.org.scope = e.target.value; state.org.q = ""; s.value = ""; setNavActive(); renderDexGrid(); clockToScope(); setHash("orgs-" + state.org.scope); });
    $("#orgSort", main).addEventListener("change", e => { state.org.sort = e.target.value; renderDexGrid(); });
  }

  function currentOrgList() {
    const o = state.org, q = o.q.toLowerCase();
    let list = (q || o.scope === "all") ? C.organisms.slice() : C.organismsFor(o.scope);
    if (isPoes() && o.sort === "lesson") list = list.filter(x => srcOf(x) === "lesson");
    if (isPoes() && o.sort === "added") list = list.filter(x => srcOf(x) === "added");
    if (q) list = list.filter(x => [x.name, x.sci || "", x.group, C.byId[x.home].name].join(" ").toLowerCase().includes(q));
    if (o.sort === "no") return list.sort((a, b) => DEX_NO[a.id] - DEX_NO[b.id]);   // by No.: oldest first
    return list.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));   // alphabetical
  }

  function ageRangeText(o) {
    const [s, e] = o.range;
    const span = C.spanOf(o).map(d => d.name);
    const where = span.length > 1 ? span[0] + " → " + span[span.length - 1] : span[0];
    if (o.extant) return `First appeared about ${C.formatAge(s, true)} · still living today · ${where}`;
    if (s === e) return `Lived about ${C.formatAge(s, true)} · ${where}`;
    const unit = (v) => v >= 1 ? "m" : "y";
    let txt;
    if (unit(s) === "m" && unit(e) === "m") txt = `${s >= 10 ? Math.round(s) : s} – ${e >= 10 ? Math.round(e) : e} million years ago`;
    else txt = `${C.formatAge(s, true)} – ${C.formatAge(e, true)}`;
    return `Lived about ${txt} · ${where}`;
  }

  function rangeBar(o, compact) {
    let [s, e] = o.range;
    // A single fossil date is shown as a narrow band (about ±2%) so its colour is visible
    if (!o.extant && s - e < s * 0.04) { const mid = (s + e) / 2; s = mid * 1.02; e = mid * 0.98; }
    // Zoomed window: the lived range plus a small margin (about 12% of the bar) on each side
    const span = s - e;
    const width = Math.max(span / 0.76, s * 0.06, 0.02);
    const pad = (width - span) / 2;
    let top = Math.min(C.EARTH_AGE, s + pad), bot = Math.max(0, e - pad);
    if (top - bot < width) { if (bot === 0) top = Math.min(C.EARTH_AGE, width); else bot = Math.max(0, top - width); }
    const W = top - bot;
    const units = ["hadean", "archean", "proterozoic"].concat(C.periods).map(id => C.byId[id])
      .filter(u => u.start > bot && u.end < top);
    const pct = v => ((top - v) / W * 100);
    const segs = units.map(u => {
      const l = pct(Math.min(u.start, top)), r = pct(Math.max(u.end, bot));
      return { u, l, w: r - l };
    });
    const spans = segs.map(g => `<span style="left:${g.l.toFixed(3)}%;width:${g.w.toFixed(3)}%;background:${g.u.color}" title="${esc(g.u.name)}"></span>`).join("");
    let left = pct(s), wd = Math.max(0, pct(e) - left);
    const MIN = 1.5;
    if (wd < MIN) { left = Math.max(0, Math.min(100 - MIN, left - (MIN - wd) / 2)); wd = MIN; }
    const right = Math.max(0, 100 - left - wd);
    // Period names under the bar: full name when there is room, else a short form (Cam, Ord, ...)
    const labels = segs.filter(g => g.w > (compact ? 14 : 4)).map(g => {
      const full = g.w > (compact ? 45 : 20), txt = full ? g.u.name : g.u.name.slice(0, 3);
      return `<em style="left:${(g.l + g.w / 2).toFixed(2)}%" title="${esc(g.u.name)}">${esc(txt)}</em>`;
    }).join("");
    let h = `<div class="range-bar${compact ? " compact" : ""}" aria-hidden="true"><div class="track">`;
    h += `<div class="layer dim">${spans}</div>`;
    h += `<div class="layer lit" style="clip-path:inset(0 ${right.toFixed(3)}% 0 ${left.toFixed(3)}%)">${spans}</div>`;
    h += `<div class="hit" style="left:${left.toFixed(3)}%;width:${wd.toFixed(3)}%"></div></div>`;
    h += `<div class="names">${labels}</div>`;
    if (!compact) h += `<div class="scale"><span>${esc(C.formatAge(top, true))}</span><span>${bot <= 0 ? "today" : esc(C.formatAge(bot, true))}</span></div>`;
    return h + `</div>`;
  }

  function lifespanText(o) {
    const [st, en] = o.range;
    const m = (v) => v >= 10 ? Math.round(v) : v;
    if (o.extant) return `${C.formatAge(st, true)} – today`;
    if (st === en) return `about ${C.formatAge(st, true)}`;
    if (st >= 1 && en >= 1) return `${m(st)} – ${m(en)} million years ago`;
    return `${C.formatAge(st, true)} – ${C.formatAge(en, true)}`;
  }
  function photoBox(o, cls) {
    const home = C.byId[o.home];
    return o.image
      ? `<span class="${cls}"><img src="${__R("img/thumbs/" + o.id + ".jpg")}" data-isrc="${"img/thumbs/" + o.id + ".jpg"}" alt="" loading="lazy" width="400" height="400"></span>`
      : `<span class="${cls} no-photo" style="background:${tint(home.color)}"><b>${esc(o.abbr || initials(o.name))}</b><small>No photo yet</small></span>`;
  }

  /* Main organism area: the card list (Pokédex grid) or one organism's page */
  function renderOrgMain(fromRoute) {
    if (state.org.selected && C.orgById[state.org.selected]) return renderOrgDetail();
    const main = $("#orgMain");
    main.innerHTML = orgToolbar() + `<div id="dexGrid"></div>`;
    wireToolbar(main);
    renderDexGrid();
    $("#panelBody").scrollTop = state.org.listScroll || 0;
    state.org.listScroll = 0;
    clockToScope();
    if (!fromRoute) setHash("orgs-" + state.org.scope);
  }
  /* Clock follows the period, era or eon chosen in the organism list */
  function clockToScope() {
    const sc = state.org.scope;
    if (sc === "all") { highlight(null, null); moveHands(0); return; }
    const d = C.byId[sc];
    moveHands(C.toClock(d.start));
    highlight(sc, [d.start, d.end]);
  }
  function renderDexGrid() {
    const o = state.org, grid = $("#dexGrid"); if (!grid) return;
    const list = currentOrgList();
    const scopeName = o.scope === "all" ? "Earth's history" : C.byId[o.scope].name + " " + C.byId[o.scope].rank;
    if (!list.length) {
      grid.innerHTML = `<div class="empty">No entries match ${o.q ? "“" + esc(o.q) + "”" : "this sort option"}${o.q ? "" : " in the " + esc(scopeName)}.<br>Try another search or choose “A to Z” in Sort.</div>`;
      return;
    }
    let h = `<p class="dex-count">${o.q ? "Search results" : esc(scopeName)} · ${list.length} organism${list.length === 1 ? "" : "s"} · ${o.sort === "no" ? "oldest to youngest" : o.sort === "lesson" ? "from lessons, A to Z" : o.sort === "added" ? "added, A to Z" : "A to Z"}</p><ul class="dex-grid">`;
    list.forEach(x => {
      const src = srcOf(x);
      h += `<li><button type="button" class="dex-card" data-org="${x.id}" aria-label="${esc(x.name)}, ${esc(lifespanText(x))}">
        ${photoBox(x, "dex-photo")}
        <span class="dex-no">${dexNo(x)}<i class="src-dot" style="background:${src === "lesson" ? "#2563c9" : "#3b8a2f"}" title="${src === "lesson" ? "From lesson slides" : "Added"}"></i></span>
        <span class="dex-name">${orgName(x)}</span>
        <span class="dex-life">${esc(lifespanText(x))}</span>
        ${rangeBar(x, true)}
      </button></li>`;
    });
    grid.innerHTML = h + `</ul>`;
    $$(".dex-card", grid).forEach(b => b.addEventListener("click", () => {
      state.org.listScroll = $("#panelBody").scrollTop;
      state.org.selected = b.dataset.org; renderOrgDetail();
    }));
  }
  function renderOrgDetail() {
    const main = $("#orgMain"), o = state.org;
    const sel = C.orgById[o.selected];
    let list = currentOrgList();
    if (!list.some(x => x.id === sel.id)) { o.q = ""; if (o.sort === "lesson" || o.sort === "added") o.sort = "az"; list = currentOrgList(); }
    if (!list.some(x => x.id === sel.id)) { o.scope = sel.home; list = currentOrgList(); }
    const i = list.findIndex(x => x.id === sel.id);
    const prev = i > 0 ? list[i - 1] : null, next = i < list.length - 1 ? list[i + 1] : null;
    const home = C.byId[sel.home];
    const homeId = o.scope === "all" ? state.div : o.scope;

    let h = `<div class="dex-nav">
        <button type="button" class="pill back-btn" id="dexBack">◂ Go back</button>
        <button type="button" class="pill home-btn" data-go="${homeId}">⌂ Home</button>
        <span class="dex-steps">
          <button type="button" class="pill step-btn" ${prev ? `data-step="${prev.id}"` : "disabled"} aria-label="${prev ? "Previous organism: " + esc(prev.name) : "No previous organism"}">◂ ${prev ? esc(prev.name) : "Previous"}</button>
          <button type="button" class="pill step-btn next-btn" ${next ? `data-step="${next.id}"` : "disabled"} aria-label="${next ? "Next organism: " + esc(next.name) : "No next organism"}">${next ? "Next: " + esc(next.name) : "Next"} ▸</button>
        </span>
      </div>`;
    let detail = `<div class="org-detail">`;
    detail += `<p class="dex-no big-no">${dexNo(sel)} <span>· ${i + 1} of ${list.length}</span></p>`;
    detail += `<h2 class="org-name">${orgName(sel, true)}</h2>`;
    if (sel.sci) detail += `<p class="org-sci">${esc(sel.sci)}</p>`;
    detail += `<div class="badges"><span class="badge ${srcOf(sel)}">${srcOf(sel) === "lesson" ? "From lesson slides" : (isPoes() ? "Added · researched" : "Added")}</span><span class="chip"><span class="swatch" style="background:${home.color}"></span>${esc(sel.group)}</span></div>`;
    const po = isPoes() ? C.poesOrganisms[sel.id] : null;
    detail += bulletsHtml(po ? po.bullets : sel.bullets);
    if (po) detail += thinkHtml(po.think);
    detail += `<p class="range-text">${esc(ageRangeText(sel))}</p>` + rangeBar(sel);
    detail += `<p class="org-credit">On the Earth clock: ${esc(C.formatClock(C.toClock(sel.range[0])))}${sel.range[0] !== sel.range[1] && !sel.extant ? " – " + esc(C.formatClock(C.toClock(sel.range[1]))) : ""}.</p>`;
    detail += `</div>`;
    const img = sel.image
      ? `<button type="button" class="org-img zoomable" data-zoom="img/full/${sel.id}.jpg" data-cap="${esc(sel.name)}" aria-label="Enlarge photo of ${esc(sel.name)}"><img src="${__R(sel.image)}" data-isrc="${esc(sel.image)}" alt="${esc(sel.name)}" width="600" height="800"></button><p class="org-credit">Tap the photo to see the full image · <a class="src-link" href="${wikiUrl(sel.name)}" target="_blank" rel="noopener">More about ${esc(sel.name)} ↗</a></p>`
      : `<div class="org-img placeholder" role="img" aria-label="Image placeholder for ${esc(sel.name)}"><span class="ph-tag">Image placeholder</span><span class="big" style="background:${tint(home.color)}">${esc((sel.abbr || initials(sel.name)))}</span><p>No verified image added yet for <b>${esc(sel.name)}</b>.</p></div>
         <p class="org-credit"><a class="src-link" href="${wikiUrl(sel.name)}" target="_blank" rel="noopener">More about ${esc(sel.name)} ↗</a></p>`;
    main.innerHTML = h + `<div class="org-layout">${detail}<div class="org-img-wrap">${img}</div></div>`;
    $("#panelBody").scrollTop = 0;
    if (window.innerWidth <= 760) { const pr = $("#panel").getBoundingClientRect(); if (pr.top < 0) window.scrollBy(0, pr.top - 8); }
    $("#dexBack").addEventListener("click", () => { state.org.selected = null; renderOrgMain(); });
    $$("[data-step]", main).forEach(b => b.addEventListener("click", () => { state.org.selected = b.dataset.step; renderOrgDetail(); }));

    if (sel.image) preload("img/full/" + sel.id + ".jpg");
    if (next && next.image) preload(next.image);
    progress.viewed.add(sel.id); saveProgress();
    moveHands(C.toClock(sel.range[0]));
    highlight(null, sel.extant ? [sel.range[0], 0] : [sel.range[0], sel.range[1]]);
    setHash("org-" + sel.id);
  }

  /* ================= QUIZ ================= */
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const bank = () => isPoes() ? C.questionsPoes.concat(C.questionsPoesSituational, C.questionsPoesDino, C.questions, C.questionsMainstreamHots) : C.questions.concat(C.questionsMainstreamHots);
  /* ================= REFERENCES ================= */
  function refHtml(r) {
    // *text* = italics; URLs become links
    return esc(r).replace(/\*([^*]+)\*/g, "<i>$1</i>")
      .replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function showReferences(fromRoute) {
    stopPlay();
    state.view = "references";
    setNavActive(); if (!fromRoute) setHash("references");
    highlight(null, null);
    const body = $("#panelBody");
    body.classList.remove("org-mode");
    const list = (C.references || []).slice().sort((a, b) => a.replace(/\*/g, "").localeCompare(b.replace(/\*/g, ""), "en", { sensitivity: "base" }));
    body.innerHTML = `<h2 class="div-title">REFERENCES</h2>
      <ol class="ref-list">${list.map(r => `<li>${refHtml(r)}</li>`).join("")}</ol>`;
    body.scrollTop = 0;
  }

  /* What the test covers: the whole timescale, one eon or one era */
  const quizScope = { type: "all", eon: "hadean", era: "paleozoic" };
  const scopeId = () => quizScope.type === "all" ? "all" : quizScope[quizScope.type];
  const scopeLabel = (id) => id === "all" ? "Whole timescale" : (C.QUIZ_SCOPES.eon.concat(C.QUIZ_SCOPES.era).find(x => x[0] === id) || [id, id])[1];
  function scopeClock(id) {
    if (id === "all") { highlight(null, null); return null; }
    const d = C.byId[id]; highlight(id, [d.start, d.end]); return [C.toClock(d.start), C.toClock(d.end)];
  }
  function showQuiz(fromRoute) {
    stopPlay();
    state.view = "quiz"; state.quiz = null;
    setNavActive(); if (!fromRoute) setHash("quiz");
    highlight(null, null);
    const body = $("#panelBody");
    body.classList.remove("org-mode");
    const best = progress.best[state.mode], tries = progress.attempts[state.mode];
    const t = quizScope.type;
    body.innerHTML = `<h2 class="div-title">TEST YOURSELF <small>${isPoes() ? "POES level" : "Mainstream level"}</small></h2>
      <div class="sub-head">What should the test cover?</div>
      <div class="scope-pick">
        <div class="scope-seg" role="group" aria-label="Test coverage">
          ${[["all", "Whole timescale"], ["eon", "By eon"], ["era", "By era"]].map(([v, l]) => `<button type="button" data-scope="${v}" aria-pressed="${t === v}">${l}</button>`).join("")}
        </div>
        ${t === "all" ? "" : `<label class="scope-which"><span>Which ${t}?</span><select id="scopeSel" aria-label="Choose the ${t}">${C.QUIZ_SCOPES[t].map(([v, l]) => `<option value="${v}"${quizScope[t] === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>`}
      </div>
      <p>Assess your understanding of the <b>${scopeId() === "all" ? "whole timescale" : esc(scopeLabel(scopeId()))}</b> by answering <b>${C.scopeLength(scopeId())} randomized multiple-choice questions.</b></p>
      <div class="meta">${modeChip()}<span class="chip">Attempts: ${tries}</span><span class="chip">Best score (whole timescale): ${best == null ? "none yet" : best + " / " + C.QUIZ_LENGTH}</span></div>
      <button type="button" class="pill" id="startQuiz">Start quiz ▸</button>`;
    body.scrollTop = 0;
    const clk = scopeClock(scopeId()); moveHands(clk ? clk[0] : 0);
    $$(".scope-seg button", body).forEach(b => b.addEventListener("click", () => { quizScope.type = b.dataset.scope; showQuiz(true); }));
    const sel = $("#scopeSel", body);
    if (sel) sel.addEventListener("change", e => { quizScope[quizScope.type] = e.target.value; showQuiz(true); });
    $("#startQuiz").addEventListener("click", startQuiz);
  }
  /* Same mix as the full test, scaled to the test length:
     Mainstream: general + Mainstream HOTS, shuffled.
     POES: POES HOTS + Mainstream, shuffled, then the scenario questions at the end
     (situational, plus dinosaur questions when the scope includes the Mesozoic). */
  function buildQuiz(scope) {
    const divs = scope === "all" ? null : C.scopeDivs(scope);
    const f = (arr) => divs ? arr.filter(x => divs.includes(x.div)) : arr.slice();
    const L = C.scopeLength(scope), used = new Set();
    const take = (arr, n) => { const out = shuffle(arr.filter(x => !used.has(x))).slice(0, Math.max(0, n)); out.forEach(x => used.add(x)); return out; };
    const main = f(C.questions), hots = f(C.questionsMainstreamHots);
    if (!isPoes()) {
      let a = take(hots, Math.round(L * C.MAINSTREAM_HOTS_PER_QUIZ / C.QUIZ_LENGTH));
      a = a.concat(take(main, L - a.length));
      a = a.concat(take(hots, L - a.length));
      return shuffle(a);
    }
    const poes = f(C.questionsPoes), sit = f(C.questionsPoesSituational), dino = f(C.questionsPoesDino);
    const perEnd = C.POES_SITUATIONAL_PER_QUIZ + C.POES_DINO_PER_QUIZ;
    const nEnd = Math.floor(L * perEnd / C.QUIZ_LENGTH);
    const nMain = Math.round(L * C.POES_MAINSTREAM_PER_QUIZ / C.QUIZ_LENGTH);
    const nDino = dino.length ? Math.round(nEnd * C.POES_DINO_PER_QUIZ / perEnd) : 0;
    let endQs = take(dino, nDino);
    endQs = endQs.concat(take(sit, nEnd - endQs.length));
    endQs = endQs.concat(take(dino, nEnd - endQs.length));
    let mid = take(poes, L - nEnd - nMain);
    mid = mid.concat(take(main.concat(hots), nMain));
    const room = () => L - mid.length - endQs.length;
    mid = mid.concat(take(poes, room()));
    mid = mid.concat(take(main.concat(hots), room()));
    return shuffle(mid).concat(shuffle(endQs));
  }
  function startQuiz() {
    const scope = scopeId();
    const qs = buildQuiz(scope).map(q => ({ q: q.q, why: q.why, correct: q.a[0], opts: shuffle(q.a) }));
    state.quiz = { qs, i: 0, score: 0, answered: false, missed: [], mode: state.mode, scope, clock: scopeClock(scope) };
    renderQuestion();
  }
  function renderQuestion() {
    const z = state.quiz, item = z.qs[z.i], body = $("#panelBody");
    moveHands(z.clock ? z.clock[0] + z.i / z.qs.length * (z.clock[1] - z.clock[0]) : z.i / z.qs.length * DAY);
    body.innerHTML = `<div class="quiz-head"><h2 class="div-title" style="margin:0">QUESTION ${z.i + 1} <small>of ${z.qs.length}</small></h2><span class="chip">Score: ${z.score}</span></div>
      <div class="qbar" aria-hidden="true"><span style="width:${(z.i / z.qs.length * 100).toFixed(1)}%"></span></div>
      <p class="qtext">${esc(item.q)}</p>
      <div class="opts">${item.opts.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>`;
    body.scrollTop = 0;
    $$(".opt", body).forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  }
  function answer(k) {
    const z = state.quiz; if (z.answered) return;
    z.answered = true;
    const item = z.qs[z.i], picked = item.opts[k], ok = picked === item.correct;
    if (ok) z.score++; else z.missed.push({ q: item.q, correct: item.correct, picked, why: item.why });
    $$(".opt").forEach((b, i) => { b.disabled = true; if (item.opts[i] === item.correct) b.classList.add("right"); else if (i === k) b.classList.add("wrong"); });
    const last = z.i === z.qs.length - 1;
    $("#fb").innerHTML = `<div class="feedback"><b>${ok ? "Correct!" : "Not quite."}</b> ${esc(item.why)}</div>
      <p><button type="button" class="pill" id="nextQ">${last ? "See results ▸" : "Next question ▸"}</button></p>`;
    $("#nextQ").addEventListener("click", () => { z.answered = false; if (last) results(); else { z.i++; renderQuestion(); } });
    $("#nextQ").focus();
  }
  function results() {
    const z = state.quiz, n = z.qs.length;
    const m = z.mode; progress.attempts[m]++; if (z.scope === "all" && (progress.best[m] == null || z.score > progress.best[m])) progress.best[m] = z.score; saveProgress();
    moveHands(z.clock ? z.clock[1] : 86399.9);
    const pct = z.score / n;
    const msg = pct === 1 ? "Perfect: you're a master of deep time!" : pct >= .8 ? "Excellent work!" : pct >= .6 ? "Good job: review the ones you missed." : "Keep exploring the clock and try again!";
    $("#panelBody").innerHTML = `<h2 class="div-title">RESULTS <small>${esc(scopeLabel(z.scope))}</small></h2><div class="score-big">${z.score} / ${n}</div><p><b>${msg}</b></p>
      ${z.missed.length ? `<div class="sub-head">Review</div><ol class="review">${z.missed.map(m => `<li><b>${esc(m.q)}</b><br>Your answer: ${esc(m.picked)} · Correct: <b>${esc(m.correct)}</b><br><span>${esc(m.why)}</span></li>`).join("")}</ol>` : ""}
      <p class="quiz-again"><button type="button" class="pill" id="retry">Try another ${n} ▸</button> <button type="button" class="pill ghost" id="changeScope">Change what the test covers</button></p>`;
    $("#panelBody").scrollTop = 0;
    $("#retry").addEventListener("click", startQuiz);
    $("#changeScope").addEventListener("click", () => showQuiz(true));
  }

  /* ================= EVENTS ================= */
  /* Full photos are preloaded in the background, and the already-loaded cropped photo is
     shown instantly until the full one is ready. */
  const preloaded = {};
  function preload(src) { if (!src || preloaded[src]) return; const i = new Image(); i.decoding = "async"; i.src = src; preloaded[src] = i; }
  function openZoom(src, cap, quick) {
    const lb = $("#lightbox"), img = $("#lbImg");
    const full = preloaded[src];
    img.alt = cap; $("#lbCap").textContent = cap;
    if (full && full.complete && full.naturalWidth) img.src = src;
    else {
      if (quick) img.src = quick;
      preload(src);
      preloaded[src].onload = () => { if (!lb.hidden) img.src = src; };
    }
    lb.hidden = false; document.body.classList.add("modal-open"); $("#lbClose").focus();
  }
  function closeZoom() { $("#lightbox").hidden = true; document.body.classList.remove("modal-open"); }
  document.addEventListener("click", e => {
    const z = e.target.closest(".zoomable");
    if (z) { const q = z.querySelector("img"); openZoom(z.dataset.zoom, z.dataset.cap, q && q.currentSrc); return; }
    if (e.target.id === "lightbox" || e.target.closest("#lbClose")) { closeZoom(); return; }
    const t = e.target.closest("[data-go],[data-orgs]");
    if (t && t.dataset.orgs) { showOrganisms(t.dataset.orgs); return; }
    if (t && t.dataset.go) {
      if (t.id === "phanBtn") { go("phanerozoic"); toggleMega(true); return; }
      stopPlay(); go(t.dataset.go); return;
    }
    if (!e.target.closest(".has-menu")) toggleMega(false);
  });
  document.addEventListener("pointerover", e => { const z = e.target.closest && e.target.closest(".zoomable"); if (z) preload(z.dataset.zoom); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { toggleMega(false); if (!$("#lightbox").hidden) closeZoom(); } });
  $("#playBtn").addEventListener("click", () => state.playing ? stopPlay() : startPlay());
  window.addEventListener("hashchange", route);

  function setMode(m, rerender) {
    state.mode = m === "poes" ? "poes" : "mainstream";
    document.body.dataset.mode = state.mode;
    $$(".mode-toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    store.set("mode", state.mode);
    renderProgress();
    if (!rerender) return;
    if (state.view === "division") showDivision(state.div, { keepHands: true, keepScroll: true, noHash: true });
    else if (state.view === "organisms") renderOrgMain();
    else if (state.view === "quiz") showQuiz(true);
  }
  const markChosen = () => { try { sessionStorage.setItem("chronos.modeChosen", "1"); } catch (e) { /* ignore */ } };
  $$(".mode-toggle button").forEach(b => b.addEventListener("click", () => { markChosen(); setMode(b.dataset.mode, true); }));

  /* ---- "Are you a POES or Mainstream student?" ---- */
  function askMode() {
    const dlg = $("#modeDialog");
    dlg.hidden = false;
    document.body.classList.add("modal-open");
    const first = $("[data-pick]", dlg); if (first) first.focus();
  }
  $$("#modeDialog [data-pick]").forEach(b => b.addEventListener("click", () => {
    markChosen(); setMode(b.dataset.pick, true);
    $("#modeDialog").hidden = true; document.body.classList.remove("modal-open");
  }));

  /* ================= INIT ================= */
  buildClock(); buildMega(); buildLegend();
  setMode(store.get("mode", "mainstream"), false);
  /* wide screens: the info box ends level with the bottom of the time box under the clock */
  function fitPanel() {
    const panel = document.getElementById("panel"), ro = document.querySelector(".readout");
    if (!panel || !ro) return;
    if (window.innerWidth < 1000) { panel.style.height = ""; return; }
    const h = Math.round(ro.getBoundingClientRect().bottom - panel.getBoundingClientRect().top);
    if (h > 200) panel.style.height = h + "px";
  }
  window.addEventListener("resize", fitPanel);
  window.addEventListener("load", fitPanel);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPanel);
  fitPanel();
  drawHands(0);
  route();
  askMode();   // ask every time the site is opened
})();

</script>
</body>
</html>
