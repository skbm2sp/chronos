<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRONOS: Geologic Timescale Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Oswald:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tan:#E2C084; --tan-dark:#c9a465; --cream:#FDF0D5; --cream-2:#f7e6c2;
  --ink:#1f1b16; --ink-soft:#4a4238; --charcoal:#4b4b4b; --charcoal-2:#5f5f5f;
  --coral:#F26B5B; --blue:#1E7FE0; --blue-dark:#1665b5; --line:#2b2621;
  --clock: clamp(420px, 40vw, 590px); --hand: "Patrick Hand SC", "Comic Sans MS", cursive;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body); color:var(--ink); min-height:100vh; background:var(--tan); position:relative}
.bg-art{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- Header ---------- */
.site-header{position:relative;text-align:center;padding:22px 16px 0}
.brand{margin:0;font-weight:800;letter-spacing:.18em;font-size:.72rem;color:var(--ink-soft);text-transform:uppercase}
.title{font-family:var(--hand);font-weight:400;font-size:clamp(2rem,5.4vw,4.2rem);letter-spacing:.06em;margin:.05em 0 .25em;line-height:1}
.mode-toggle{position:absolute;top:12px;right:16px;font-family:var(--hand);font-size:1.05rem;display:flex;gap:4px;align-items:center}
.mode-toggle button{background:none;border:0;padding:2px 4px;border-bottom:3px solid transparent}
.mode-toggle button[aria-pressed="true"]{border-bottom-color:#3b3a1c}

.main-nav{max-width:1100px;margin:0 auto;position:relative;z-index:20}
.main-nav ul{list-style:none;margin:0;padding:10px 26px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
  background:var(--charcoal-2);border-radius:40px 34px 38px 30px / 26px 30px 24px 30px;
  box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(0,0,0,.12)}
.main-nav li{display:flex;align-items:center;position:relative}
.main-nav li + li::before{content:"|";color:#2c2c2c;font-family:var(--hand);font-size:1.5rem;margin:0 6px}
.nav-btn{background:none;border:0;color:#262626;font-family:var(--hand);font-size:clamp(1.05rem,2vw,1.55rem);letter-spacing:.06em;padding:4px 10px;border-radius:14px}
.nav-btn:hover{background:rgba(255,255,255,.14)}
.nav-btn.active{background:var(--cream);color:var(--ink);box-shadow:inset 0 -3px 0 var(--coral)}
.caret{display:inline-block;transition:transform .2s;font-size:.8em}
#phanBtn[aria-expanded="true"] .caret{transform:rotate(90deg)}

.mega{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--cream);border:2px solid var(--line);
  border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);min-width:560px;text-align:left}
.mega[hidden]{display:none}
.mega h4{margin:0 0 6px}
.mega h4 button{background:none;border:0;padding:4px 6px;font-family:var(--hand);font-size:1.25rem;border-radius:8px;width:100%;text-align:left}
.mega h4 button:hover,.mega li button:hover{background:var(--cream-2)}
.mega ul{list-style:none;margin:0;padding:0;display:block;background:none;box-shadow:none}
.mega ul li::before{content:none}
.mega li button{background:none;border:0;width:100%;text-align:left;padding:5px 8px;border-radius:8px;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;font-weight:600;font-size:.95rem}
.swatch{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);flex:none}
.mega .when{flex-basis:100%;padding-left:20px;margin-top:-2px;font-weight:600;color:var(--ink-soft);font-size:.76rem;white-space:nowrap}

/* ---------- Stage: clock + panel ---------- */
.stage{display:flow-root;position:relative;max-width:1480px;margin:28px auto 0;padding:0 18px;min-height:calc(var(--clock) + 130px)}
.clock-wrap{position:absolute;left:18px;top:0;width:var(--clock);z-index:5}
.clock{width:var(--clock);height:var(--clock);filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.clock svg{width:100%;height:100%;display:block;overflow:visible}
.seg{cursor:pointer;transition:opacity .15s}
.seg:hover{opacity:.78}
.seg.sel{stroke:#111;stroke-width:2.2}
.hand{transition:none}
.readout{text-align:center;margin-top:8px}
.readout-time{font-family:var(--hand);font-size:1.9rem;line-height:1}
.readout-age{font-size:.9rem;color:var(--ink-soft);font-weight:700}
.clock-controls{margin-top:6px}
.ctl{background:var(--charcoal);color:#fff;border:0;border-radius:20px;padding:6px 14px;font-weight:700;font-size:.85rem}
.ctl:hover{background:#333}

.panel{margin-left:calc(var(--clock) * .55);background:var(--cream);border:2.5px solid var(--line);border-radius:6px 10px 8px 4px;
  height:calc(var(--clock) * .88);margin-top:calc(var(--clock) * .06);position:relative;
  box-shadow:4px 6px 0 rgba(0,0,0,.12)}
.panel-scroll{height:100%;overflow-y:auto;padding:24px 30px 24px calc(var(--clock) * .45 + 32px);scrollbar-width:thin;scrollbar-color:#2b2621 transparent}
.panel-scroll::-webkit-scrollbar{width:10px}
.panel-scroll::-webkit-scrollbar-thumb{background:transparent;border:2px solid #2b2621;border-radius:10px}

/* ---------- Division view ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.crumbs button{background:none;border:0;padding:0 2px;font-weight:700;color:var(--blue-dark);text-decoration:underline;text-underline-offset:2px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.clock-range{font-family:var(--hand);font-size:1.55rem;line-height:1.1}
.pill{background:var(--blue);color:#fff;border:2px solid #0d3e73;border-radius:22px;padding:7px 14px;font-weight:800;font-size:.85rem;white-space:nowrap;box-shadow:0 2px 0 #0d3e73}
.pill:hover{background:var(--blue-dark)}
.pill:disabled{background:#9aa6b2;border-color:#6d7681;box-shadow:none;cursor:not-allowed}
.div-title{font-family:var(--hand);font-weight:400;font-size:clamp(2rem,3.4vw,2.8rem);margin:.1em 0 .05em;line-height:1.05;letter-spacing:.04em}
.div-title small{font-family:var(--body);font-size:.95rem;font-weight:700;letter-spacing:0;color:var(--ink-soft);margin-left:6px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff8e8;border:1.5px solid #d9c49a;border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:700}
.bullets{margin:4px 0 12px;padding-left:1.3em;line-height:1.5}
.bullets li{margin:4px 0}
.bullets ul{padding-left:1.2em;margin:2px 0;list-style:"– "}
.sub-head{font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 6px}
.children{display:flex;flex-wrap:wrap;gap:8px}
.child-btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:.9rem}
.child-btn:hover{background:var(--cream-2)}
.child-btn .when{font-weight:400;font-size:.75rem;color:var(--ink-soft)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.ph{margin:0}
.ph-box{aspect-ratio:1/1;background:repeating-linear-gradient(45deg,#ecebe6,#ecebe6 8px,#e3e1da 8px,#e3e1da 16px);border:2.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:4px;font-size:.72rem;color:#555}
.ph-box .ph-tag{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.62rem;background:#fff;border:1px solid #bbb;border-radius:4px;padding:1px 5px}
.ph figcaption{font-size:.78rem;margin-top:4px;line-height:1.3}
.ph figcaption a,.src-link{color:var(--blue-dark);font-weight:700}
.stepper{display:flex;justify-content:space-between;gap:10px;margin-top:16px;border-top:1.5px dashed #cdb88e;padding-top:10px}
.stepper button{background:none;border:0;font-weight:800;color:var(--ink);padding:4px 0}
.stepper button:disabled{opacity:.35;cursor:default}

/* ---------- Organism view ---------- */
.org-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 140px;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:4px 10px}
.search input{border:0;outline:0;font:inherit;background:none;width:100%;font-size:.9rem}
.org-toolbar select{font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:20px;padding:5px 8px;background:#fff;max-width:170px}
.seg-filter{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden}
.seg-filter button{background:#fff;border:0;padding:5px 10px;font-size:.78rem;font-weight:800}
.seg-filter button + button{border-left:2px solid var(--line)}
.seg-filter button[aria-pressed="true"]{background:var(--charcoal);color:#fff}
.org-layout{display:grid;grid-template-columns:128px minmax(0,1fr) minmax(220px,280px);gap:18px;align-items:start}
.org-list{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column;gap:12px;max-height:340px;overflow-y:auto;scrollbar-width:thin}
.org-dot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.org-dot .ring{width:58px;height:58px;border-radius:50%;border:3.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:1.25rem;background:#fff;position:relative}
.org-dot .ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed transparent}
.org-dot[aria-current="true"] .ring::after{border-color:#555}
.org-dot .lbl{font-size:.74rem;font-weight:700;line-height:1.2;text-align:center;width:100%;padding:0 2px;overflow-wrap:anywhere;hyphens:auto}
.org-dot .src-dot{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--cream)}
.org-name{font-family:var(--hand);font-weight:400;font-size:clamp(1.45rem,2vw,2.2rem);margin:0;line-height:1.08;letter-spacing:.03em;overflow-wrap:anywhere}
.org-sci{font-style:italic;color:var(--ink-soft);font-weight:600;margin:0 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.badge{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:2px 7px;border:1.5px solid}
.badge.lesson{background:#e6f0ff;border-color:#2563c9;color:#173f80}
.badge.added{background:#e9f7e6;border-color:#3b8a2f;color:#245a1c}
.badge.group{background:#f3e8ff;border-color:#7d4bb8;color:#4d2a78}
.org-img{border:2.5px solid var(--line);background:#f7f7f5;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:8px}
.org-img .ph-tag{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.65rem;background:#fff;border:1px solid #bbb;border-radius:4px;padding:2px 6px}
.org-img .big{font-family:var(--hand);font-size:2.6rem;width:90px;height:90px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.org-img p{margin:0;font-size:.78rem;color:#555}
.org-img img{width:100%;height:100%;object-fit:cover}
.org-credit{font-size:.72rem;color:var(--ink-soft);margin-top:4px}
.range-bar{margin:12px 0 4px}
.range-bar .track{position:relative;height:18px;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;background:#eee}
.range-bar .layer{position:absolute;inset:0;display:flex}
.range-bar .layer span{display:block;height:100%;flex:none}
.range-bar .layer.dim{filter:grayscale(1) opacity(.35)}
.range-bar .hit{position:absolute;top:0;bottom:0;box-shadow:inset 0 0 0 2px #111;border-radius:3px}
.range-bar .scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-soft);margin-top:3px}
.range-text{font-size:.85rem;font-weight:700;margin:2px 0}
.empty{padding:20px;text-align:center;color:var(--ink-soft);border:2px dashed #cdb88e;border-radius:10px}
.back-btn{margin-left:auto}
.result-group{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-top:4px}

/* ---------- Quiz ---------- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qbar{height:10px;background:#efe0bf;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.qbar span{display:block;height:100%;background:var(--coral);transition:width .3s}
.qtext{font-size:1.15rem;font-weight:800;margin:10px 0 12px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){background:var(--cream-2)}
.opt .key{font-family:var(--hand);font-size:1.2rem;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.opt.right{background:#e3f6dd;border-color:#2f7d24}
.opt.wrong{background:#fde3df;border-color:#b3261e}
.opt:disabled{cursor:default}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px;background:#fff8e8;border:1.5px solid #d9c49a;font-size:.92rem}
.score-big{font-family:var(--hand);font-size:4rem;line-height:1;margin:10px 0}
.review{padding-left:1.2em;font-size:.9rem;line-height:1.45}
.review li{margin-bottom:8px}

/* ---------- Legend & footer ---------- */
.legend-row{max-width:1480px;margin:18px auto 0;padding:0 18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
.legend button{background:none;border:0;display:flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;padding:2px 4px;border-radius:6px}
.legend button:hover{background:rgba(255,255,255,.35)}
.legend-note{text-align:center;font-size:.8rem;color:var(--ink-soft);margin:6px auto 0;max-width:720px}
.site-footer{max-width:1480px;margin:14px auto 0;padding:12px 18px 26px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;text-align:center;font-size:.75rem;color:var(--ink-soft)}
#progress{font-weight:800;color:var(--ink)}

/* ---------- Responsive ---------- */
/* organism view: static toolbar, columns scroll on their own */
.panel-scroll.org-mode{display:flex;flex-direction:column;overflow:hidden}
.org-mode .org-toolbar{flex:none;padding-bottom:10px;margin-bottom:12px;border-bottom:1.5px dashed #cdb88e}
.org-mode #orgMain{flex:1;min-height:0}
.org-mode .org-layout{height:100%}
.org-mode .org-list{max-height:none;height:100%}
.org-mode .org-detail,.org-mode .org-img-wrap{height:100%;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
@media (max-width:1100px){
  :root{--clock:400px}
  .org-layout{grid-template-columns:120px minmax(0,1fr)} .org-img-wrap{grid-column:2;max-width:300px}
  .org-mode #orgMain{overflow-y:auto}
  .org-mode .org-layout{height:auto}
  .org-mode .org-detail,.org-mode .org-img-wrap{height:auto;overflow:visible}
  .org-mode .org-list{position:sticky;top:0;height:auto;max-height:420px}
}
@media (max-width:900px){ :root{--clock:340px} .photos{gap:8px} }
@media (max-width:760px){
  :root{--clock:min(90vw,420px)}
  .mode-toggle{position:static;justify-content:center;margin-bottom:6px}
  .main-nav ul{border-radius:18px;padding:8px 10px}
  .main-nav li + li::before{margin:0 2px}
  .main-nav li.has-menu{position:static}
  .mega{left:0;right:0;transform:none;min-width:0;grid-template-columns:1fr;max-height:65vh;overflow:auto}
  .stage{min-height:0;margin-top:22px}
  .clock-wrap{position:static;margin:0 auto}
  .panel{height:auto}
  .panel{margin:16px 0 0;height:auto;min-height:0}
  .panel-scroll{padding:18px 16px;height:auto;overflow:visible}
  .panel-scroll.org-mode{display:block;overflow:visible}
  .org-mode .org-toolbar{position:sticky;top:0;z-index:6;background:var(--cream);padding-top:8px}
  .org-mode #orgMain{overflow:visible}
  .org-mode .org-list{position:static;max-height:none}
  .org-layout{grid-template-columns:1fr}
  .org-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .org-dot{width:104px;flex:none}
  .org-img-wrap{grid-column:auto;max-width:300px;width:100%;margin:0 auto}
  .org-img{aspect-ratio:3/4}
  .div-title small{display:block;margin:2px 0 0}
}
@media (max-width:420px){ .photos{grid-template-columns:repeat(3,1fr)} .ph figcaption{font-size:.68rem} .pill{font-size:.75rem;padding:6px 10px} }

/* ---------- 24-hour clock interactions ---------- */
#clockSvg{touch-action:none;outline:none;border-radius:50%}
#clockSvg:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.hand{cursor:grab}
#clockSvg.dragging,#clockSvg.dragging .hand{cursor:grabbing}
#clockSvg.dragging .seg{pointer-events:none}
.hand:hover line:first-child{stroke:#333}
.hand-sec{pointer-events:none}
.drag-hint{margin:4px 0 0;font-size:.78rem;font-weight:700;color:var(--ink-soft)}

/* ---------- Mode dialog ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(40,28,10,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.modal[hidden]{display:none}
.modal-card{background:var(--cream);border:3px solid var(--line);border-radius:16px;max-width:620px;width:100%;padding:26px 26px 22px;text-align:center;box-shadow:6px 8px 0 rgba(0,0,0,.25)}
.modal-card h2{font-family:var(--hand);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);margin:.15em 0 .2em;line-height:1.1}
.modal-sub{color:var(--ink-soft);font-size:.92rem;margin:0 0 16px}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{border:3px solid var(--line);border-radius:14px;padding:22px 16px;background:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;line-height:1.4;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.pick:hover{transform:translateY(-2px)}
.pick:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pick-title{font-family:var(--hand);font-size:1.7rem;letter-spacing:.06em}
.pick.poes{background:#fff1ee}.pick.poes .pick-title{color:#b3392c}
.pick.mainstream{background:#eef5ff}.pick.mainstream .pick-title{color:#1665b5}
@media (max-width:520px){.pick-grid{grid-template-columns:1fr}}

/* ---------- Mode content ---------- */
.mode-chip.poes{background:#fff1ee;border-color:#e3a197;color:#8f2a1f}
.mode-chip.mainstream{background:#eef5ff;border-color:#9dbbe6;color:#174b88}
.hots{display:inline-block;background:var(--coral);color:#fff;border-radius:5px;padding:0 6px;font-size:.7rem;letter-spacing:.06em;margin-left:4px}
.think-list{display:grid;gap:8px;margin-bottom:10px}
.think{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.think summary{cursor:pointer;font-weight:800;font-size:.92rem;list-style:none;display:flex;gap:8px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"?";flex:none;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.think[open] summary::before{content:"✓";background:#2f7d24}
.think p{margin:8px 0 2px 30px;font-size:.9rem;line-height:1.45}
.mode-toggle{background:rgba(253,240,213,.75);border-radius:10px;padding:2px 8px}
.hand line:not(.grip){pointer-events:none}
.hand .grip{pointer-events:stroke}
.photos{grid-template-columns:repeat(3,minmax(0,210px))}
.ph-box{overflow:hidden;word-break:break-word}

/* ---------- photos ---------- */
.ph-box{aspect-ratio:4/3;padding:0;background:#ddd;cursor:zoom-in;display:block;width:100%;overflow:hidden}
.ph-box img,.org-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}
.ph-box:hover img,.org-img:hover img{transform:scale(1.04)}
.org-img{aspect-ratio:3/4;padding:0;cursor:zoom-in;width:100%;overflow:hidden;display:block;background:#ddd}
.org-dot .ring{background-size:cover;background-position:center;color:transparent}
.org-dot[aria-current="true"] .ring{box-shadow:0 0 0 3px var(--coral)}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(20,14,6,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox[hidden]{display:none}
.lb-card{position:relative;margin:0;max-width:min(92vw,960px);background:var(--cream);border:3px solid var(--line);border-radius:12px;padding:10px;box-shadow:6px 8px 0 rgba(0,0,0,.35)}
.lb-card img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;border-radius:6px}
.lb-card figcaption{font-family:var(--hand);font-size:1.4rem;text-align:center;margin-top:6px}
.lb-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:#fff;font-weight:800;font-size:1rem}

/* Keep form controls readable when the device uses dark mode */
:root{color-scheme:light}
input,select,textarea,option{color:var(--ink);background-color:#fff;color-scheme:light}
.search input::placeholder{color:#7a7066;opacity:1}
select option:checked{background:#e8dcc2;color:var(--ink)}

/* zoomed timeline bar */
.range-bar .layer{display:block}
.range-bar .layer span{position:absolute;top:0;bottom:0}
.range-bar .names{position:relative;height:14px;margin-top:2px}
.range-bar .names em{position:absolute;transform:translateX(-50%);font-style:normal;font-size:.66rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}

/* Mainstream: no lesson/added filter (everything is "Added") */
body[data-mode="mainstream"] .seg-filter{display:none}

.org-dot .ring.no-photo{color:var(--ink)}
.org-img.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;cursor:default;background:#f7f5ef;text-align:center}

/* Organism badges: identical height, size and alignment */
.badges{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 10px}
.badges .badge,.badges .chip{display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;height:28px;padding:0 12px;
  border-radius:14px;border-width:1.5px;border-style:solid;font-size:.78rem;line-height:1;white-space:nowrap;margin:0;vertical-align:middle}
.badges .badge{font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.badges .chip{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badges .chip .swatch{flex:none}
.badges{flex-direction:column;align-items:flex-start;gap:6px}
.badges .chip{height:auto;min-height:28px;padding:5px 12px;white-space:normal;line-height:1.25;overflow:visible;text-overflow:clip;border-radius:14px}

/* ---------- Organism strip (horizontal, fixed under the toolbar) ---------- */
.org-strip{flex:none;display:flex;align-items:center;gap:6px;margin:0 0 10px;padding-bottom:10px;border-bottom:1.5px dashed #cdb88e}
.strip-viewport{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none}
.strip-viewport::-webkit-scrollbar{display:none}
.strip-viewport .org-list{display:flex;flex-direction:row;gap:6px;padding:6px 2px 2px;margin:0;max-height:none;height:auto;overflow:visible}
.strip-viewport .org-list li{flex:none}
.strip-viewport .org-dot{width:96px}
.strip-arrow{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.4rem;line-height:1;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 0 3px;box-shadow:0 2px 0 var(--line)}
.strip-arrow:hover:not(:disabled){background:var(--cream-2)}
.strip-arrow:disabled{opacity:.3;cursor:default;box-shadow:none}
.org-strip.no-scroll .strip-arrow{visibility:hidden}
.org-mode .org-layout{grid-template-columns:minmax(0,1fr) minmax(220px,280px)}
.org-mode #orgMain{overflow-y:auto}
.org-mode .org-layout{height:auto;min-height:100%}
.org-mode .org-detail,.org-mode .org-img-wrap{height:auto;overflow:visible}
@media (max-width:1100px){ .org-mode .org-layout{grid-template-columns:minmax(0,1fr) minmax(200px,260px)} .org-img-wrap{grid-column:auto} }
@media (max-width:760px){
  .org-mode .org-head{position:sticky;top:0;z-index:6;background:var(--cream);padding-top:8px}
  .org-mode .org-toolbar{position:static;padding-top:0}
  .org-mode .org-layout{grid-template-columns:1fr}
  .strip-viewport .org-dot{width:84px}
}

.org-head{flex:none}
.strip-viewport .org-dot{width:104px}
.strip-viewport .org-dot .lbl{overflow-wrap:normal;word-break:normal;hyphens:manual}
@media (max-width:760px){ .strip-viewport .org-dot{width:100px} }

/* sub-lists use hollow bullets */
.bullets ul{list-style:circle;padding-left:1.3em}
.bullets ul li::marker{color:var(--ink-soft)}
.bullets strong{font-weight:800;color:var(--ink)}

/* ---------- Pokédex-style organism list and pages ---------- */
.dex-toolbar{position:sticky;top:-24px;z-index:6;background:var(--cream);padding:6px 0 10px;margin:-6px 0 6px;border-bottom:1.5px dashed #cdb88e}
.dex-count{font-size:.8rem;font-weight:800;color:var(--ink-soft);margin:6px 0 10px;text-transform:uppercase;letter-spacing:.05em}
.dex-grid{list-style:none;margin:0;padding:0 0 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.dex-card{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:8px 8px 10px;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s;font:inherit;color:inherit}
.dex-card:hover,.dex-card:focus-visible{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.dex-card:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.dex-photo{display:block;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#f2efe8;border:1.5px solid #d8cdb5;position:relative}
.dex-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.dex-photo.no-photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dex-photo.no-photo b{font-family:var(--hand);font-weight:400;font-size:2.2rem;line-height:1}
.dex-photo.no-photo small{font-size:.66rem;font-weight:700;color:var(--ink-soft)}
.dex-no{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;color:#7a6f60;margin-top:4px}
.dex-no .src-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dex-name{font-weight:800;font-size:.95rem;line-height:1.2}
.dex-life{font-size:.74rem;color:var(--ink-soft);font-weight:700;line-height:1.3}
.range-bar.compact{margin-top:4px}
.range-bar.compact .track{height:10px}
.range-bar.compact .names em{font-size:.6rem}
.dex-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 14px;padding-bottom:12px;border-bottom:1.5px dashed #cdb88e}
.dex-nav .dex-steps{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill.home-btn{background:var(--charcoal)}
.pill.step-btn{background:#fff;color:var(--ink);border:2px solid var(--line)}
.pill.step-btn.next-btn{background:var(--coral);color:#fff;border-color:var(--line)}
.pill.step-btn:disabled{opacity:.4;cursor:default}
.big-no{font-size:.85rem;margin:0}
.big-no span{font-weight:700;color:var(--ink-soft)}
@media (max-width:760px){
  .dex-toolbar{top:0}
  .dex-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .dex-nav .dex-steps{margin-left:0}
}
#orgMain .org-layout{grid-template-columns:minmax(0,1fr) minmax(200px,280px)}
#orgMain .org-img-wrap{grid-column:auto;max-width:none}
@media (max-width:760px){ #orgMain .org-layout{grid-template-columns:1fr} #orgMain .org-img-wrap{max-width:300px;margin:0 auto} }
.dex-nav .back-btn{margin-left:0}

/* ---------- References ---------- */
.ref-intro{font-size:.9rem;color:var(--ink-soft);margin:4px 0 12px}
.ref-list{list-style:none;margin:0;padding:0;font-size:.88rem;line-height:1.5}
.ref-list li{padding-left:2em;text-indent:-2em;margin:0 0 10px;overflow-wrap:anywhere}
.ref-list a{color:var(--blue-dark)}

/* ---------- Fluid layout: the panel keeps a readable size at any window size ---------- */
.dex-photo img{object-position:center}
.sort-pick{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800}
.sort-pick select{font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:20px;padding:5px 8px;background:#fff}
#panelBody{container-type:inline-size;container-name:panel}
@container panel (max-width:600px){
  #orgMain .org-layout{grid-template-columns:1fr}
  #orgMain .org-img-wrap{max-width:300px;width:100%;margin:0 auto}
  .dex-nav .dex-steps{margin-left:0}
  .photos{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1000px){
  /* clock + time box fit the window height; the info box ends where the time box ends (set in app.js) */
  :root{--clock:clamp(340px, min(calc(52vw - 160px), calc(100vh - 380px)), 590px)}
  .panel{height:calc(var(--clock) * .94 + 150px)}
}
@media (min-width:761px) and (max-width:999px){
  :root{--clock:min(44vw, 400px)}
  .stage{min-height:0;margin-top:18px}
  .clock-wrap{position:static;width:auto;display:grid;grid-template-columns:var(--clock) minmax(0,1fr);gap:18px;align-items:center}
  .readout{margin-top:0}
  .readout-time{font-size:2.2rem}
  .panel{margin:18px 0 0;height:clamp(520px, calc(100vh - 120px), 900px)}
  .panel-scroll{padding:22px 24px}
}
@media (min-width:1000px){
  .readout{width:fit-content;max-width:100%;margin:-6px auto 0;z-index:6;padding:6px 14px 10px;border-radius:16px;background:rgba(226,192,132,.94);position:relative}
}
/* Bigger time readout */
.readout-time{font-size:2.8rem}
.readout-age{font-size:1.15rem}
.drag-hint{font-size:.95rem}
.ctl{font-size:1rem;padding:8px 18px}
@media (min-width:1000px){ .readout{padding:10px 22px 14px} }
@media (max-width:760px){ .readout-time{font-size:2.4rem} }
/* Test coverage picker */
.scope-pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:6px 0 4px}
.scope-seg{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.scope-seg button{background:#fff;border:0;padding:7px 14px;font-size:.9rem;font-weight:800;cursor:pointer;color:var(--ink)}
.scope-seg button + button{border-left:2px solid var(--line)}
.scope-seg button[aria-pressed="true"]{background:var(--charcoal);color:#fff}
.scope-which{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem}
.scope-which select{font:inherit;font-weight:700;padding:6px 10px;border:2px solid var(--line);border-radius:12px;background:#fff}
.quiz-again{display:flex;flex-wrap:wrap;gap:10px}
.pill.ghost{background:#fff;color:var(--ink)}
@media (max-width:420px){ .scope-seg button{padding:7px 10px;font-size:.82rem} }

CHRONOS.periods = CHRONOS.divisions.filter(d => d.rank === "period").map(d => d.id);

/* Seconds after midnight on the 24-hour Earth Clock for an age in Ma */
CHRONOS.toClock = function (ma) {
  return (CHRONOS.EARTH_AGE - ma) / CHRONOS.EARTH_AGE * 86400;
};

/* "2:58 AM" / "11:59:12 PM"; seconds shown in the last hour of the day */
CHRONOS.formatClock = function (s, forceSeconds) {
  if (s >= 86399.5) return "12:00 midnight";
  const showSecs = forceSeconds || s >= 82800;
  const total = showSecs ? Math.round(s) : Math.round(s / 60) * 60;   // round to the nearest minute when seconds are hidden
  let h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = total % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  const showSec = showSecs;
  return h12 + ":" + mm + (showSec ? ":" + ss : "") + " " + ampm;
};

/* Short date label: "4.6 bya", "542 mya", "300,000 years ago" */
CHRONOS.formatAge = function (ma, long) {
  if (ma <= 0) return "today";
  if (ma >= 1000) {
    const b = (ma / 1000);
    return (Math.round(b * 10) / 10) + (long ? " billion years ago" : " bya");
  }
  if (ma >= 1) {
    const v = ma >= 10 ? Math.round(ma) : Math.round(ma * 10) / 10;
    return v + (long ? " million years ago" : " mya");
  }
  const years = Math.round(ma * 1e6);
  const nice = years >= 10000 ? Math.round(years / 1000) * 1000 : Math.round(years / 100) * 100;
  return nice.toLocaleString("en-US") + " years ago";
};

CHRONOS.formatDuration = function (ma) {
  if (ma >= 1000) return (Math.round(ma / 100) / 10) + " billion years";
  if (ma >= 1) return (ma >= 10 ? Math.round(ma) : Math.round(ma * 10) / 10) + " million years";
  return Math.round(ma * 1e6).toLocaleString("en-US") + " years";
};

/* Short era-range label for a division, e.g. "4.6–4.0 bya" */
CHRONOS.rangeLabel = function (d) {
  const f = (v) => v >= 1000 ? (Math.round(v / 100) / 10).toFixed(1) : (v >= 10 ? Math.round(v) : Math.round(v * 100) / 100);
  if (d.start >= 1000 && d.end >= 1000) return f(d.start) + "–" + f(d.end) + " bya";
  if (d.start >= 1000) return f(d.start) + " bya – " + f(d.end) + " mya";
  if (d.end === 0) return f(d.start) + " mya – present";
  return f(d.start) + "–" + f(d.end) + " mya";
};

/* Which period (or Precambrian eon) contains an age */
CHRONOS.divisionAt = function (ma) {
  if (ma > 542) {
    return CHRONOS.eons.map(id => CHRONOS.byId[id]).find(d => ma <= d.start && ma > d.end) || CHRONOS.byId.hadean;
  }
  return CHRONOS.periods.map(id => CHRONOS.byId[id]).find(d => ma <= d.start && ma > d.end) || CHRONOS.byId.quaternary;
};

CHRONOS.lineage = function (id) {
  const out = []; let d = CHRONOS.byId[id];
  while (d) { out.unshift(d); d = d.parent ? CHRONOS.byId[d.parent] : null; }
  return out;
};

/* Organisms to list for a division (period, era or eon) */
CHRONOS.organismsFor = function (divId) {
  const d = CHRONOS.byId[divId];
  const ids = new Set([divId]);
  (function walk(x) { CHRONOS.byId[x].children.forEach(c => { ids.add(c); walk(c); }); })(divId);
  const list = CHRONOS.organisms.filter(o => {
    if (ids.has(o.home)) return true;
    if (o.extant) return false;            // living groups: listed only where they first appear
    const [s, e] = o.range;
    const EPS = 0.05;                       // ignore overlaps that only touch a boundary (e.g. 251.9 vs 251.902)
    return s > d.end + EPS && e < d.start - EPS;
  });
  return list.sort((a, b) => b.range[0] - a.range[0] || a.name.localeCompare(b.name));
};

/* Periods/eons an organism's range passes through */
CHRONOS.spanOf = function (o) {
  const [s, e] = o.range;
  const units = ["archean", "proterozoic"].concat(CHRONOS.periods).map(id => CHRONOS.byId[id]);
  const EPS = 0.05;
  const hit = units.filter(d => (s > d.end + EPS && e < d.start - EPS) || (s === e && s <= d.start && s > d.end));
  return hit.length ? hit : [CHRONOS.byId[o.home]];
};

": "The continents later moved apart, carrying the fossils with them.", "div": "paleozoic"}, {"q": "Why are Cambrian fossils far more common than fossils from earlier times?", "a": ["Many animals developed hard parts that fossilize easily", "Earlier animals were too large to fossilize", "Earlier rocks are all underwater", "Cambrian animals lived longer"], "why": "Shells, exoskeletons and spines are preserved much more easily than soft bodies.", "div": "paleozoic"}, {"q": "Anomalocaris had large grasping front appendages and a round mouth lined with plates. What role did it most likely play?", "a": ["A top predator", "A plant that made its own food", "A filter feeder on the sea floor", "A decomposer of dead plants"], "why": "Grasping appendages are tools for catching prey.", "div": "paleozoic"}, {"q": "Opabinia's long, flexible snout ended in a claw. How did it most likely use it?", "a": ["To grab food and pass it to its mouth", "To breathe air", "To dig burrows in rock", "To fly short distances"], "why": "Its mouth was under its head, so the snout reached out to catch food.", "div": "paleozoic"}, {"q": "Pikaia had blocks of muscle along its body. Why do scientists find it so interesting?", "a": ["It is an early relative of the group that includes vertebrates, like us", "It was the first land plant", "It was the largest Cambrian predator", "It was an early trilobite"], "why": "Pikaia was an early chordate.", "div": "paleozoic"}, {"q": "Wiwaxia was covered in scales and tall spines. What were the spines most likely for?", "a": ["Protection from predators", "Catching sunlight", "Swimming fast", "Breathing"], "why": "Many Cambrian animals evolved defenses as predators appeared.", "div": "paleozoic"}, {"q": "A fossil has a hard exoskeleton divided lengthwise into three lobes and jointed legs. To which group does it belong?", "a": ["Trilobites", "Radiodonts", "Jawless fish", "Sea scorpions"], "why": "\"Trilobite\" means three lobes.", "div": "paleozoic"}, {"q": "Ordovician nautiloids had long, straight, chambered shells and hunted other animals. Which living animal lives most like them?", "a": ["The nautilus", "The sea star", "The clam", "The jellyfish"], "why": "The living nautilus also has a chambered shell and hunts or scavenges.", "div": "paleozoic"}, {"q": "The first land plants of the Ordovician were small and simple, like liverworts. Why did they stay close to damp places?", "a": ["They had no roots or veins to move water through their bodies", "They needed salt from the sea", "They ate insects found near water", "Sunlight was too weak on dry land"], "why": "Plants without veins must soak up water directly from their surroundings.", "div": "paleozoic"}, {"q": "Cooksonia carried its spore capsules at the tips of its branches. Why would this help?", "a": ["Spores released higher up could be carried farther by the wind", "It protected the spores from rain", "It kept the spores warmer at night", "It helped the plant catch insects"], "why": "Height helps spores spread to new places.", "div": "paleozoic"}, {"q": "Silurian sea scorpions grew large and hunted other animals. What does this tell us about Silurian seas?", "a": ["Arthropods were among the top predators", "There were no predators in the seas", "Fish ruled every part of the seas", "Sea life had not yet appeared"], "why": "Sea scorpions (eurypterids) were large predators in Silurian seas.", "div": "paleozoic"}, {"q": "Why could a millipede-like animal such as Kampecaris live on land in the Silurian but not in the Cambrian?", "a": ["By the Silurian, land plants gave food and shelter; Cambrian land was bare", "Cambrian land was covered in ice", "Cambrian air had too much oxygen", "Millipedes need volcanoes to live"], "why": "Animals followed plants onto land.", "div": "paleozoic"}, {"q": "Guiyu oneiros had jaws, while Arandaspis did not. What could Guiyu do that Arandaspis could not?", "a": ["Bite and grab prey", "Breathe air on land", "Make its own food", "Fly short distances"], "why": "Jaws let fish feed on many kinds of food, including other animals.", "div": "paleozoic"}, {"q": "Dunkleosteus had thick bony armor covering its head. How would this armor most likely help it?", "a": ["It protected its head from injury", "It helped it float", "It made its own food", "It helped it breathe air"], "why": "Many early fish were armored for protection.", "div": "paleozoic"}, {"q": "Which fish would be the best model for how four-limbed animals began?", "a": ["A lobe-finned fish with bones inside its fins", "A jawless fish with no paired fins", "A shark with a cartilage skeleton", "A fish with thin, ray-like fins"], "why": "Tetrapods evolved from lobe-finned fish, whose fin bones match limb bones.", "div": "paleozoic"}, {"q": "The first forests appeared in the Devonian. How would forests change the land?", "a": ["Roots broke up rock and dead plants built up soil", "They turned the land into desert", "They removed all oxygen from the air", "They stopped rain from falling"], "why": "Plants help make soil, which then supports more life.", "div": "paleozoic"}, {"q": "Seed plants appeared in the Devonian. How did seeds help plants spread into drier places?", "a": ["A seed carries stored food in a protective coat and does not need water to start like spores", "Seeds can swim to new places", "Seeds make their own sunlight", "Seeds turn into animals"], "why": "Seed plants later spread widely in the dry Permian.", "div": "paleozoic"}, {"q": "Carboniferous coal formed because dead trees were buried before they fully decayed. What would happen if decomposers had quickly broken down all the dead plants?", "a": ["Much less coal would have formed", "Even more coal would have formed", "The plants would have become limestone", "Nothing would change"], "why": "Coal forms only when plant matter is buried before it rots away.", "div": "paleozoic"}, {"q": "Which animal would have the best chance of laying its eggs far from water?", "a": ["An amniote like Hylonomus", "An early tetrapod like Pederpes", "A lobe-finned fish like Eusthenopteron", "A trilobite"], "why": "Amniote eggs can develop on land.", "div": "paleozoic"}, {"q": "Hylonomus fossils were found inside hollow fossil tree stumps. What does this suggest about how it lived?", "a": ["It lived on land, in forests", "It lived in the deep sea", "It lived in deserts with no plants", "It lived on ice sheets"], "why": "The stumps were part of Carboniferous forests.", "div": "paleozoic"}, {"q": "Arthropleura had two pairs of legs on each body segment. Which living animal shares this feature?", "a": ["A millipede", "A spider", "A dragonfly", "A crab"], "why": "Arthropleura was a giant relative of millipedes.", "div": "paleozoic"}, {"q": "Pangaea's Permian interior had vast deserts. Which animals would do better there, and why?", "a": ["Reptiles, because of their dry skin and shelled eggs", "Amphibians, because they lay eggs in water", "Fish, because they have gills", "Trilobites, because they lived in seas"], "why": "Reptiles do not need to return to water to lay eggs.", "div": "paleozoic"}, {"q": "A cartoon shows Dimetrodon fighting a T. rex. What is wrong with it?", "a": ["They lived more than 200 million years apart", "Dimetrodon lived in the sea", "T. rex was a plant-eater", "Nothing: they lived together"], "why": "Dimetrodon lived about 295–272 million years ago; T. rex about 68–66 million years ago.", "div": "paleozoic"}, {"q": "Biarmosuchus had different kinds of teeth, including long canines. Which living group also has teeth of different kinds?", "a": ["Mammals", "Snakes", "Sharks", "Birds"], "why": "Therapsids like Biarmosuchus were part of the line that led to mammals.", "div": "paleozoic"}, {"q": "How could huge volcanic eruptions in Siberia cause extinctions around the whole world, not just near the volcanoes?", "a": ["Their gases changed the climate and oceans worldwide", "The lava flowed across every continent", "The ash buried every animal", "The eruptions moved the continents"], "why": "The Siberian Traps led to warming, acid rain and loss of oxygen in the oceans.", "div": "paleozoic"}, {"q": "In Ordovician seas, the top predators were nautiloids, not fish. What does this tell us?", "a": ["Large predatory fish had not evolved yet", "Fish were larger than nautiloids", "Fish lived only on land", "There were no animals in the seas"], "why": "Ordovician fish like Arandaspis were small and jawless.", "div": "paleozoic"}, {"q": "Which supercontinent formed near the end of the Paleozoic Era?", "a": ["Pangaea", "Rodinia", "Laurasia", "Gondwana"], "why": "Gondwana collided with North America and Europe, joining all the continents into Pangaea.", "div": "paleozoic"}, {"q": "In an undisturbed stack of rock layers, which period's rocks would lie directly beneath Triassic rocks?", "a": ["Permian", "Cambrian", "Jurassic", "Devonian"], "why": "Older layers lie below younger ones, and the Permian came just before the Triassic.", "div": "paleozoic"}, {"q": "Why can soft-bodied animals like Pikaia be preserved in the Burgess Shale but not in most rocks?", "a": ["They were buried quickly in fine mud that slowed decay", "They were frozen in ice", "They had hard shells", "They lived on land"], "why": "Fast burial in fine mud can preserve even soft tissues.", "div": "paleozoic"}, {"q": "Trilobites lived from the Cambrian to the Permian. In which era's rocks would you NOT find them?", "a": ["Mesozoic", "Paleozoic", "Both eras", "Neither era"], "why": "Trilobites died out in the Great Dying at the end of the Paleozoic.", "div": "paleozoic"}, {"q": "Biarmosuchus was a meat-eater with saber-like canine teeth. In a Permian food web, what would it most likely eat?", "a": ["Small four-legged animals", "Conifer leaves", "Seeds", "Algae"], "why": "Long canine teeth are typical of meat-eaters.", "div": "paleozoic"}, {"q": "Arandaspis had bony armor but no paired fins. How would this affect its swimming compared with later fish?", "a": ["It would be less able to steer and balance", "It would swim much faster", "It could fly out of the water", "It could swim backwards easily"], "why": "Paired fins give fish control as they swim.", "div": "paleozoic"}, {"q": "Why did animals need lungs before they could live on land?", "a": ["Gills do not work well out of water, so they needed a way to breathe air", "Lungs help animals swim deeper", "Lungs help animals see in the dark", "Lungs make animals lighter"], "why": "Out of water, gills collapse and dry out.", "div": "paleozoic"}, {"q": "A Carboniferous fossil trackway shows the marks of many pairs of legs crossing a forest floor. Which animal most likely made it?", "a": ["Arthropleura, a giant millipede relative", "Meganeura, a giant flying insect", "Dunkleosteus, an armored fish", "Orthoceras, a nautiloid"], "why": "Fossil trackways show Arthropleura crawled across forest floors.", "div": "paleozoic"}, {"q": "Why is the Mesozoic called \"middle life\"?", "a": ["It comes between the Paleozoic (\"old life\") and the Cenozoic (\"new life\")", "It is in the middle of Earth's whole history", "Its animals were medium-sized", "It lasted exactly half of Earth's history"], "why": "The three eras are named in order: old, middle and new life.", "div": "mesozoic"}, {"q": "Which fossil collection best shows why the Mesozoic is called the Age of Reptiles?", "a": ["Dinosaurs, pterosaurs and ichthyosaurs", "Trilobites, sea scorpions and nautiloids", "Mammoths, saber-toothed cats and ground sloths", "Armored fish, early sharks and lobe-finned fish"], "why": "Reptiles ruled the land, sea and air in the Mesozoic.", "div": "mesozoic"}, {"q": "A layer with the first birds lies above a layer with the first dinosaurs. Which periods do the layers most likely come from?", "a": ["Jurassic above Triassic", "Triassic above Jurassic", "Cretaceous above Jurassic", "Permian above Triassic"], "why": "The first dinosaurs appeared in the Triassic; the first birds, in the Jurassic.", "div": "mesozoic"}, {"q": "White sea cliffs made of thick chalk layers with marine fossils most likely formed in which period?", "a": ["Cretaceous", "Cambrian", "Carboniferous", "Quaternary"], "why": "Cretaceous comes from the Latin creta, \"chalk\".", "div": "mesozoic"}, {"q": "Crocodiles and birds are both archosaurs. What does this suggest?", "a": ["Crocodiles are more closely related to birds than to lizards", "Crocodiles evolved from birds", "Birds and crocodiles are the same species", "Lizards are archosaurs too"], "why": "Archosaurs (\"ruling reptiles\") gave rise to crocodiles, pterosaurs and dinosaurs, including birds.", "div": "mesozoic"}, {"q": "Mammals appeared in the Late Triassic, about the same time as the first dinosaurs. Why did mammals stay small for so long?", "a": ["Dinosaurs filled most of the large-animal roles", "Mammals could not eat plants", "The climate was too cold for big mammals", "Mammals lived only in the sea"], "why": "Mammals became large only after the non-avian dinosaurs died out.", "div": "mesozoic"}, {"q": "How could Pangaea splitting apart cause a mass extinction at the end of the Triassic?", "a": ["Huge volcanic eruptions along the split released gases that changed the climate", "The continents crushed animals as they moved", "The oceans drained away", "Ice covered the whole planet"], "why": "The CAMP eruptions released huge amounts of carbon dioxide.", "div": "mesozoic"}, {"q": "Jurassic forests were mostly conifers, cycads and ferns. What would giant plant-eating sauropods mostly have eaten?", "a": ["Conifers, cycads and ferns", "Grass", "Fruits from flowering trees", "Fish"], "why": "Grasslands and fruit-bearing plants spread much later.", "div": "mesozoic"}, {"q": "Why do the coasts of South America and Africa fit together like puzzle pieces?", "a": ["They split apart as the Atlantic Ocean opened in the Mesozoic", "Glaciers carved them to match", "Rivers shaped both coasts", "It is a coincidence"], "why": "The Atlantic began to open in the Jurassic.", "div": "mesozoic"}, {"q": "The asteroid that caused the K–Pg extinction struck which place?", "a": ["The Yucatán Peninsula, Mexico", "Siberia, Russia", "The Sahara, Africa", "Antarctica"], "why": "It formed the Chicxulub crater about 66 million years ago.", "div": "mesozoic"}, {"q": "Which animal living today descends from dinosaurs that survived the K–Pg extinction?", "a": ["A pigeon", "A crocodile", "A lizard", "A shark"], "why": "Birds are avian dinosaurs. Crocodiles are archosaurs too, but not dinosaurs.", "div": "mesozoic"}, {"q": "Lystrosaurus had a beak and two tusks and was a therapsid. Which living group is it more closely related to?", "a": ["Mammals", "Lizards", "Birds", "Crocodiles"], "why": "Therapsids are part of the line that led to mammals.", "div": "mesozoic"}, {"q": "Hundreds of Coelophysis skeletons were found together at Ghost Ranch, New Mexico. What could this suggest?", "a": ["Many of them died in the same place, possibly at the same time", "Coelophysis lived only one at a time", "Coelophysis was a sea animal", "The skeletons belong to different eras"], "why": "Large groups of fossils in one place can record a single event.", "div": "mesozoic"}, {"q": "Shonisaurus, a giant marine reptile, is the state fossil of Nevada, which is a desert today. What does finding it there show?", "a": ["Nevada was once covered by sea", "Shonisaurus walked across deserts", "Deserts are where sea life began", "Nevada has always been a desert"], "why": "Places change greatly over millions of years.", "div": "mesozoic"}, {"q": "Which of these is a flying reptile but NOT a dinosaur?", "a": ["Pteranodon", "Archaeopteryx", "Velociraptor", "Tyrannosaurus rex"], "why": "Pteranodon was a pterosaur. Archaeopteryx was an early bird, which makes it a dinosaur.", "div": "mesozoic"}, {"q": "Stegosaurus had two rows of large bony plates on its back. Which is a likely use scientists suggest for them?", "a": ["Display, such as showing off to others", "Flying", "Swimming", "Digging burrows"], "why": "Scientists think the plates may have been used for display or to help control body heat.", "div": "mesozoic"}, {"q": "Rhamphorhynchus had a long tail ending in a diamond-shaped vane. What might the vane have helped with?", "a": ["Steering while flying", "Digging", "Breathing underwater", "Grinding food"], "why": "A vane at the end of a long tail could act like a rudder.", "div": "mesozoic"}, {"q": "Archaeornithura had long legs like a wading bird. Where did it most likely find its food?", "a": ["In shallow water at the edges of lakes", "High in treetops", "Deep in the ocean", "Underground"], "why": "Long legs let wading birds walk in shallow water.", "div": "mesozoic"}, {"q": "Spinosaurus had a long, narrow snout with cone-shaped teeth. Which living animal has a similar snout for a similar diet?", "a": ["A crocodile", "A cow", "A woodpecker", "A giraffe"], "why": "Long, narrow snouts with cone-shaped teeth are good for catching fish.", "div": "mesozoic"}, {"q": "Velociraptor had feathers but could not fly. What were its feathers most likely used for?", "a": ["Keeping warm and display", "Flying long distances", "Swimming", "Breathing"], "why": "Feathers evolved in dinosaurs before they were used for flight.", "div": "mesozoic"}, {"q": "Triceratops and Edmontosaurus were plant-eaters that lived alongside T. rex. What role did T. rex most likely play?", "a": ["A top predator that hunted them", "A plant-eater that competed with them", "A decomposer", "A filter feeder"], "why": "T. rex was a large meat-eater.", "div": "mesozoic"}, {"q": "T. rex had tiny two-fingered arms but a huge head with powerful jaws. What did it most likely use to catch prey?", "a": ["Its jaws", "Its arms", "Its tail", "Its feathers"], "why": "T. rex had the strongest bite of any land animal.", "div": "mesozoic"}, {"q": "Quetzalcoatlus had a wingspan of about 10–11 m. Which is closest to that width?", "a": ["The length of a school bus", "The length of a pencil", "The height of a door", "The width of a football field"], "why": "A school bus is about 11–12 m long.", "div": "mesozoic"}, {"q": "Eomaia was an early relative of placental mammals. Which living animals are placental mammals?", "a": ["Humans, dogs and whales", "Kangaroos and koalas", "Platypuses", "Lizards and snakes"], "why": "Kangaroos and koalas are marsupials; platypuses are monotremes.", "div": "mesozoic"}, {"q": "A Cretaceous mammal fossil shows bones that supported a pouch for carrying young. To which group does it most likely belong?", "a": ["Marsupials", "Monotremes", "Placentals", "Reptiles"], "why": "Marsupials, like kangaroos, raise their young in a pouch.", "div": "mesozoic"}, {"q": "A dinosaur fossil walked on two legs and had sharp, curved teeth and claws. What did it most likely eat?", "a": ["Meat", "Leaves", "Seeds", "Algae"], "why": "Sharp, curved teeth are typical of meat-eaters like theropods.", "div": "mesozoic"}, {"q": "A dinosaur fossil has a long neck, a small head, pillar-like legs and peg-like teeth. What did it most likely eat?", "a": ["Plants", "Fish", "Other dinosaurs", "Insects"], "why": "These are features of plant-eating sauropods.", "div": "mesozoic"}, {"q": "The original fossil of Atychodracon was destroyed by bombing in World War II. Why do museums make casts and photographs of important fossils?", "a": ["To keep a record in case the original is lost or damaged", "To make the fossils heavier", "To change how the animal looked", "Because originals are not real"], "why": "Casts and photos let scientists keep studying a fossil even if the original is lost.", "div": "mesozoic"}, {"q": "Which lists the periods of the Mesozoic from oldest to youngest?", "a": ["Triassic, Jurassic, Cretaceous", "Jurassic, Triassic, Cretaceous", "Cretaceous, Jurassic, Triassic", "Triassic, Cretaceous, Jurassic"], "why": "The Mesozoic is divided into the Triassic, Jurassic and Cretaceous.", "div": "mesozoic"}, {"q": "The interior of Pangaea in the Triassic was hot and dry. Which kind of plant would do best there?", "a": ["Seed plants like conifers", "Mosses that need standing water", "Seaweed", "Liverworts that live in damp places"], "why": "Seeds let plants reproduce without water; conifers became more common in the Triassic.", "div": "mesozoic"}, {"q": "Why could giant sauropods find enough food in the Jurassic?", "a": ["The warm, humid climate grew lush forests", "The land was covered in ice", "There were no plants, so they ate rocks", "They hunted other dinosaurs"], "why": "Forests of conifers, cycads and ferns covered much of the land.", "div": "mesozoic"}, {"q": "Ichthyosaurs lived in the sea but had no gills. How did they breathe?", "a": ["They came to the surface to breathe air with lungs", "They breathed through their skin", "They breathed water through their nostrils", "They did not need to breathe"], "why": "Like dolphins, ichthyosaurs breathed air.", "div": "mesozoic"}, {"q": "How was a pterosaur's wing different from a bird's wing?", "a": ["It was skin stretched from a very long fourth finger, not feathers", "It was made of feathers, like a bird's", "It had no bones at all", "It was made of scales"], "why": "Pterosaurs, birds and bats evolved wings separately.", "div": "mesozoic"}, {"q": "In a rock sequence, the last non-avian dinosaur fossils lie just below a layer dated to 66 million years ago. What does that layer mark?", "a": ["The end of the Mesozoic and the K–Pg extinction", "The start of the Mesozoic", "The Great Dying", "The first appearance of dinosaurs"], "why": "The K–Pg extinction ended the Cretaceous and the Mesozoic.", "div": "mesozoic"}, {"q": "Small mammals like Eomaia's relatives survived the K–Pg extinction better than large dinosaurs. Which trait most likely helped?", "a": ["Being small, so they needed less food and could hide", "Being huge, so they could store food", "Having armor", "Living only in deserts"], "why": "Small animals can survive on less food when food chains collapse.", "div": "mesozoic"}, {"q": "Triceratops lived about 68–66 million years ago and Stegosaurus about 155–148 million years ago. Could they have met?", "a": ["No: about 80 million years separate them", "Yes: they lived together", "Yes, but only in the sea", "No: Triceratops lived first"], "why": "Stegosaurus died out long before Triceratops appeared.", "div": "mesozoic"}, {"q": "A fossil animal has legs held straight beneath its body and an open hip socket. Is it more likely a dinosaur or a lizard?", "a": ["A dinosaur", "A lizard", "A fish", "A pterosaur"], "why": "Lizards' legs sprawl out to the sides.", "div": "mesozoic"}, {"q": "Why are fossils of marine reptiles like ichthyosaurs more common than fossils of tiny land mammals from the same time?", "a": ["Bodies on the sea floor are buried quickly in sediment, while tiny bones on land break and scatter", "Mammals did not exist then", "Marine reptiles had no bones", "Land mammals turned into stone faster"], "why": "Quick burial makes fossilization more likely.", "div": "mesozoic"}, {"q": "Coelophysis lived in the Triassic, Allosaurus in the Jurassic and T. rex in the Cretaceous; all three were theropods. What does this show?", "a": ["Meat-eating theropods lived throughout the Mesozoic", "Theropods lived only in the Jurassic", "They all lived at the same time", "Theropods were plant-eaters"], "why": "Theropods were the main land predators of all three Mesozoic periods.", "div": "mesozoic"}, {"q": "Why is the Cenozoic called the Age of Mammals?", "a": ["After the non-avian dinosaurs died out, mammals diversified and became the largest land animals", "Mammals first appeared in the Cenozoic", "Only mammals lived in the Cenozoic", "Mammals caused the dinosaurs to die out"], "why": "Mammals had existed since the Triassic but stayed small until then.", "div": "cenozoic"}, {"q": "A layer with Pakicetus, an early whale relative, lies below a layer with Lucy. Which periods do the layers most likely come from?", "a": ["Paleogene below Neogene", "Neogene below Paleogene", "Quaternary below Paleogene", "Cretaceous below Jurassic"], "why": "Pakicetus lived about 50 million years ago; Lucy lived about 3.2 million years ago.", "div": "cenozoic"}, {"q": "\"Paleogene\" means \"ancient born\" and \"Neogene\" means \"new born\". Why do the names fit?", "a": ["The Paleogene is the older part of the Cenozoic and the Neogene the younger part", "Paleogene animals were born in the sea", "Neogene animals were all newborns", "They happened at the same time"], "why": "Paleo means old; neo means new.", "div": "cenozoic"}, {"q": "Ice began forming on Antarctica in the Paleogene. Which change would follow around the world?", "a": ["Global cooling and lower sea levels", "Global warming and higher sea levels", "No change at all", "The oceans would boil"], "why": "Water locked up in ice lowers sea levels.", "div": "cenozoic"}, {"q": "Purgatorius is one of the earliest known primate relatives. Which living animals are its relatives?", "a": ["Monkeys, apes and humans", "Dogs and cats", "Whales and dolphins", "Birds"], "why": "Primates include monkeys, apes and humans.", "div": "cenozoic"}, {"q": "Pakicetus lived on land about 50 million years ago, yet whales today live only in water. What does this show?", "a": ["Whales evolved from land mammals", "Whales evolved from fish", "Land mammals evolved from whales", "Pakicetus was not related to whales"], "why": "Pakicetus had skull and ear features found only in cetaceans.", "div": "cenozoic"}, {"q": "Before the Isthmus of Panama formed, sea animals could swim between the Atlantic and Pacific there. What happened to them after it formed?", "a": ["Populations on each side were separated", "They could cross more easily", "They all moved onto land", "Nothing changed"], "why": "The same land bridge that joined two continents divided two oceans.", "div": "cenozoic"}, {"q": "The oldest hominin fossils, like Lucy, are found in Africa. What does this suggest?", "a": ["The human lineage began in Africa", "Humans began in Europe", "Hominins appeared on every continent at once", "Lucy lived in Asia"], "why": "Hominins appeared in Africa during the Neogene.", "div": "cenozoic"}, {"q": "Lucy's skeleton is about 40% complete. Why is this considered remarkable?", "a": ["Most hominin fossils are only a few bones or teeth", "Most fossils are 100% complete", "Bones never fossilize", "She was the only hominin ever found"], "why": "A skeleton this complete shows how the whole body worked.", "div": "cenozoic"}, {"q": "Megalodon was about 15–20 m long; a great white shark is about 6 m long. About how many times longer was Megalodon?", "a": ["About 3 times", "About 10 times", "About the same", "Half as long"], "why": "15–20 m is roughly three times 6 m.", "div": "cenozoic"}, {"q": "Merychippus had three toes but stood mostly on the middle one; modern horses have a single hoof. What does this show?", "a": ["Horses' feet changed gradually over time", "Horses never changed", "Horses evolved from birds", "Merychippus was not a horse"], "why": "Fossil horses show a step-by-step change toward one toe.", "div": "cenozoic"}, {"q": "Livyatan had huge teeth in both jaws, while today's sperm whale feeds mainly on squid. How did Livyatan's diet most likely differ?", "a": ["It hunted large prey such as other whales", "It ate only plants", "It filtered tiny plankton", "It ate the same food as today's sperm whale"], "why": "Teeth up to about 36 cm long are built for large prey.", "div": "cenozoic"}, {"q": "Deinotherium's tusks grew from its lower jaw, while an elephant's grow from its upper jaw. What does this show?", "a": ["Relatives of elephants did not all look or feed alike", "Deinotherium was not a mammal", "Elephants evolved from Deinotherium's tusks", "Tusks always grow from the lower jaw"], "why": "Deinotherium probably used its downward tusks to strip bark and branches.", "div": "cenozoic"}, {"q": "Leptobos fossils come from open grasslands. Which kind of teeth would you expect it to have?", "a": ["Flat, grinding teeth for tough grass", "Sharp, curved teeth for meat", "No teeth", "Needle-like teeth for catching fish"], "why": "Grazers need teeth that can grind tough plants.", "div": "cenozoic"}, {"q": "We live in the Quaternary, a period of repeated ice ages. Which feature of it can we still see today?", "a": ["Large ice sheets covering Greenland and Antarctica", "Pangaea", "Dinosaurs", "Trilobites"], "why": "Earth is now in a warmer stage between ice advances.", "div": "cenozoic"}, {"q": "Why did large animals like mammoths have more trouble surviving rapid change than small animals?", "a": ["They needed lots of food and had few young, so their numbers recovered slowly", "They were too fast", "They could not see well", "They lived in the sea"], "why": "Big animals usually breed slowly.", "div": "cenozoic"}, {"q": "The oldest Homo sapiens fossils are from Africa, about 300,000 years old; fossils in other continents are younger. What does this suggest?", "a": ["Our species began in Africa and later spread", "Our species began in Europe", "Homo sapiens appeared everywhere at once", "Homo sapiens is older than Australopithecus"], "why": "Younger fossils farther away show the spread.", "div": "cenozoic"}, {"q": "Megatherium was a ground sloth up to 6 m long; today's tree sloths are small. What does this show?", "a": ["Some relatives of living animals were much larger in the past", "Tree sloths are the ancestors of Megatherium", "Sloths have never changed", "Megatherium was not a sloth"], "why": "Megatherium and Eremotherium were as heavy as elephants.", "div": "cenozoic"}, {"q": "Smilodon and Megatherium both died out about 12,000–10,000 years ago in the Americas. What links them?", "a": ["The end-Pleistocene extinction of ice age megafauna", "The K–Pg asteroid impact", "The Great Dying", "The Ordovician extinction"], "why": "About 65% of all megafauna disappeared.", "div": "cenozoic"}, {"q": "Homo habilis had a larger brain than Australopithecus and is linked with early stone tools. What connection might this show?", "a": ["Bigger brains are linked with making and using tools", "Smaller brains made better tools", "Tools made brains shrink", "There is no connection"], "why": "Tools and larger brains appear together in the human lineage.", "div": "cenozoic"}, {"q": "Homo erectus had long legs and body proportions like ours. What would it do well?", "a": ["Walk long distances upright", "Climb trees most of the time", "Swim in the ocean", "Fly"], "why": "This helped Homo erectus spread from Africa into Asia.", "div": "cenozoic"}, {"q": "Homo erectus made hand axes. Which job would a hand axe be useful for?", "a": ["Cutting meat and chopping plants", "Writing", "Catching fish with a hook", "Lighting a fire by itself"], "why": "Hand axes were all-purpose cutting tools.", "div": "cenozoic"}, {"q": "Woolly mammoth remains are sometimes found frozen in Siberia with fur still attached. Why does freezing preserve them so well?", "a": ["Cold slows down decay", "Ice turns bones into stone", "Mammoths had no bacteria", "Freezing makes animals larger"], "why": "Decay needs warmth to work quickly.", "div": "cenozoic"}, {"q": "Megaloceros is called the \"Irish elk\", but its closest living relative is the fallow deer. Why can common names be misleading?", "a": ["They may come from where fossils were found, not from how animals are related", "Common names are always scientific", "Elk and deer are the same animal", "Names never change"], "why": "Many Megaloceros skeletons were found in Irish bogs.", "div": "cenozoic"}, {"q": "What does \"Cenozoic\" mean?", "a": ["New life", "Middle life", "Ancient life", "Visible life"], "why": "The Cenozoic, the Age of Mammals, means \"new life\".", "div": "cenozoic"}, {"q": "Grasses spread as the Neogene climate became cooler and drier. Which animal would benefit the most?", "a": ["A grazer with grinding teeth, like Merychippus", "A fish that lives in coral reefs", "A tree-dwelling insect-eater", "A sea scorpion"], "why": "Grazing mammals diversified as grasslands spread.", "div": "cenozoic"}, {"q": "Glyptodon was covered by a rigid shell of bony plates, like a giant armadillo. How would the shell help it?", "a": ["It protected it from predators", "It helped it fly", "It helped it swim fast", "It helped it climb trees"], "why": "Armor is a defense against predators.", "div": "cenozoic"}, {"q": "Titanoboa, a snake about 13 m long, lived in Colombia about 60 million years ago. Why does its size tell scientists about the climate?", "a": ["Snakes depend on outside heat, so a snake this big needed a very hot climate", "Big snakes only live in cold places", "Snakes make their own heat", "Its size tells us nothing"], "why": "Its size suggests the tropics were hotter then than today.", "div": "cenozoic"}, {"q": "Paraceratherium was about 4.8 m tall at the shoulder and had a long neck. Which food could it reach that others could not?", "a": ["Leaves high in trees", "Roots underground", "Fish in rivers", "Insects in the soil"], "why": "Like giraffes, tall browsers reach high leaves.", "div": "cenozoic"}, {"q": "Arsinoitherium looked like a rhinoceros, but it was related to elephants. Why can't scientists classify animals by looks alone?", "a": ["Unrelated animals can evolve similar body shapes", "All animals look the same", "Looks always show relationships", "Elephants evolved from rhinos"], "why": "This is called convergent evolution.", "div": "cenozoic"}, {"q": "Waimanu, one of the earliest penguins, lived only a few million years after the dinosaurs died out. What does this show?", "a": ["Some modern bird groups appeared soon after the extinction", "Penguins appeared before dinosaurs", "Birds evolved from penguins", "Penguins evolved in the Triassic"], "why": "Birds diversified quickly in the Paleogene.", "div": "cenozoic"}, {"q": "Enaliarctos could swim with flippers but was more active on land than modern seals. What does this show?", "a": ["Seals evolved from land animals that gradually adapted to water", "Seals evolved from fish", "Seals have never changed", "Enaliarctos could fly"], "why": "Enaliarctos is one of the earliest pinnipeds.", "div": "cenozoic"}, {"q": "Diprotodon, a giant marsupial, lived in Australia. Why are marsupials so common in Australia today?", "a": ["Australia was isolated for millions of years, so marsupials diversified there", "Marsupials cannot live anywhere else", "Placental mammals never existed", "Australia is the coldest continent"], "why": "Isolation lets groups evolve without outside competitors.", "div": "cenozoic"}, {"q": "Gigantopithecus went extinct when its forest home changed and it could not adapt. What does this teach us about species today?", "a": ["Species that depend on one habitat are at risk when it changes", "Habitat change never affects species", "Large animals always adapt easily", "Only small animals go extinct"], "why": "Habitat loss is a major cause of extinction today.", "div": "cenozoic"}, {"q": "Dire wolves hunted large ice age animals. Why did they most likely die out when those animals disappeared?", "a": ["They lost their main food", "They became too fast", "They moved to the sea", "They turned into gray wolves"], "why": "Predators depend on their prey.", "div": "cenozoic"}, {"q": "Charles Darwin found Toxodon fossils that looked unlike any living animal. How did fossils like this influence his thinking?", "a": ["They showed that species can change and go extinct over time", "They proved animals never change", "They showed all animals are the same", "They had no effect"], "why": "Darwin called Toxodon one of the strangest animals ever discovered.", "div": "cenozoic"}, {"q": "Poebrotherium, an early camel, lived in North America, but wild camels today live in Africa and Asia. What does this show?", "a": ["A group can die out where it first evolved and survive elsewhere", "Camels first evolved in Africa", "Camels have always lived in the same place", "Poebrotherium was not a camel"], "why": "Camels first evolved in North America.", "div": "cenozoic"}, {"q": "Proailurus, one of the earliest cats, probably spent much of its time in trees. Which cat behavior might come from such ancestors?", "a": ["Climbing", "Swimming in the ocean", "Flying", "Burrowing deep underground"], "why": "Many cats today are good climbers.", "div": "cenozoic"}, {"q": "Megalodon is known mainly from teeth found in many parts of the world. What does this suggest?", "a": ["It lived in oceans around the world", "It lived only in one lake", "It lived on land", "It had no skeleton at all"], "why": "Shark skeletons are cartilage, but their teeth fossilize well.", "div": "cenozoic"}, {"q": "Asteroid impacts and heat from radioactive decay kept the young Earth molten. If the impacts had stopped earlier, what would most likely have happened?", "a": ["The surface would have cooled and formed solid crust sooner", "Earth would have stayed molten forever", "The Moon would have formed later", "The oceans would have boiled away"], "why": "Without constant impacts adding heat, the surface could cool.", "div": "hadean"}, {"q": "The Moon's surface is covered in ancient craters, but Earth shows almost none from the Hadean. Why?", "a": ["Earth's surface has been reshaped by moving plates, erosion and water, erasing old craters", "Asteroids never hit Earth", "Earth was hidden behind the Moon", "Craters on Earth fill with ice"], "why": "The Moon has no plate movement, water or weather to erase its craters.", "div": "hadean"}, {"q": "Rocks brought back from the Moon are very similar to rocks from Earth's mantle. Which idea does this support?", "a": ["The Moon formed from material thrown out when a Mars-sized body (Theia) struck Earth", "The Moon was captured from far away", "The Moon formed before the Sun", "The Moon is made of ice"], "why": "Similar rocks suggest a shared origin.", "div": "hadean"}, {"q": "Why are rocks from the Hadean so rare today?", "a": ["Most have been melted, recycled or worn away over billions of years", "No rocks existed in the Hadean", "Hadean rocks are all on the Moon", "Scientists have never looked for them"], "why": "Only tiny zircon crystals about 4.4 billion years old survive.", "div": "hadean"}, {"q": "Why is there no fossil record of life from the Hadean?", "a": ["The surface was molten and constantly bombarded, and very few rocks from that time remain", "Hadean animals had no bones", "Fossils from that time were collected and lost", "Life in the Hadean was too large to fossilize"], "why": "No confirmed fossils of life are known from the Hadean.", "div": "hadean"}, {"q": "What had to happen before oceans could form on the early Earth?", "a": ["The surface had to cool enough for water vapor to fall as rain and collect", "Animals had to appear", "Plants had to make oxygen", "The Moon had to disappear"], "why": "Liquid water cannot collect on a molten surface.", "div": "hadean"}, {"q": "Which three eons make up Precambrian Time?", "a": ["Hadean, Archean and Proterozoic", "Archean, Proterozoic and Phanerozoic", "Hadean, Archean and Phanerozoic", "Paleozoic, Mesozoic and Cenozoic"], "why": "Precambrian Time covers the formation of Earth and the emergence of life, and is divided into the Hadean, Archean and Proterozoic.", "div": "hadean"}, {"q": "Earth formed about 4.6 billion years ago, and the Hadean ended about 4.0 billion years ago. About how long did the Hadean last?", "a": ["About 600 million years", "About 6 million years", "About 4 billion years", "About 60,000 years"], "why": "4.6 − 4.0 = 0.6 billion years.", "div": "hadean"}, {"q": "Why does the name \"Archean\", meaning \"beginning\", fit this eon?", "a": ["Life first appeared during it", "Earth formed during it", "Dinosaurs first appeared during it", "It is the most recent eon"], "why": "The first single-celled life appeared in the Archean.", "div": "archean"}, {"q": "The Archean air had almost no free oxygen. Could an animal like a human have survived there?", "a": ["No, because humans need oxygen to breathe", "Yes, because humans breathe methane", "Yes, because humans do not need air", "No, because it was too cold"], "why": "The early air was mostly nitrogen, carbon dioxide, methane and water vapor.", "div": "archean"}, {"q": "A cell has no nucleus. What type of cell is it, and in which eon did such cells first appear?", "a": ["A prokaryote, in the Archean", "A eukaryote, in the Archean", "A prokaryote, in the Phanerozoic", "A eukaryote, in the Hadean"], "why": "The first life forms were prokaryotes.", "div": "archean"}, {"q": "Stromatolites still grow today in places like Shark Bay, Australia. How does this help scientists understand ancient stromatolites?", "a": ["They can compare living mounds with fossil ones to see how they formed", "It proves stromatolites are animals", "It shows stromatolites are made of ice", "It does not help at all"], "why": "Living stromatolites are built by layers of microbes, just like the fossil ones.", "div": "archean"}, {"q": "The first small continents formed in the Archean. What had to happen first?", "a": ["Earth's crust had to cool and harden", "Plants had to grow on land", "The oceans had to dry up", "Pangaea had to break apart"], "why": "A molten surface cannot form lasting continents.", "div": "archean"}, {"q": "Cyanobacteria began photosynthesis in the Archean. How did this eventually change Earth's air?", "a": ["It added oxygen", "It removed all nitrogen", "It added methane only", "It had no effect"], "why": "Their oxygen later caused the Great Oxygenation Event.", "div": "archean"}, {"q": "Aerobic bacteria are prokaryotes that...", "a": ["use oxygen to release energy from food", "make their own food by photosynthesis", "have a nucleus", "cannot survive where there is oxygen"], "why": "Aerobic bacteria use oxygen for energy (aerobic respiration).", "div": "archean"}, {"q": "Why does the name \"Proterozoic\" (\"earlier life\") fit this eon?", "a": ["Life became more complex, but it came before the eon of abundant visible fossils", "No life existed during it", "It is the most recent eon", "Dinosaurs lived during it"], "why": "The Phanerozoic, meaning \"visible life\", comes after it.", "div": "proterozoic"}, {"q": "Red, rust-colored soil layers are common in rocks younger than about 2.4 billion years but rare in older rocks. What does this show?", "a": ["Oxygen built up in the air around that time (the Great Oxygenation Event)", "The Moon formed around that time", "Dinosaurs appeared then", "The oceans froze then"], "why": "Iron turns red when it reacts with oxygen.", "div": "proterozoic"}, {"q": "Banded iron formations formed when dissolved iron in seawater reacted with oxygen. What would happen if there had been no oxygen?", "a": ["The iron would stay dissolved, and no bands would form", "Even more bands would form", "The iron would turn to gold", "The oceans would dry up"], "why": "Banded iron formations record oxygen building up.", "div": "proterozoic"}, {"q": "Why was the formation of the ozone layer important for life moving onto land later?", "a": ["It blocks much of the Sun's harmful ultraviolet radiation", "It provides food for plants", "It keeps the oceans from freezing", "It makes the sky blue"], "why": "Without ozone, life on land would be exposed to damaging radiation.", "div": "proterozoic"}, {"q": "Eukaryotic cells have a nucleus and organelles. Which living things are made of eukaryotic cells?", "a": ["Plants, animals and fungi", "Only bacteria", "Only cyanobacteria", "Only viruses"], "why": "Bacteria, including cyanobacteria, are prokaryotes.", "div": "proterozoic"}, {"q": "Rodinia formed and broke apart in the Proterozoic, long before Pangaea. What does this show?", "a": ["Supercontinents have formed and broken apart more than once", "Rodinia and Pangaea were the same", "Continents never move", "Pangaea formed first"], "why": "Continents keep moving over Earth's history.", "div": "proterozoic"},
