 {"q": "During \"Snowball Earth\", ice covered much of the planet. Why would the ice make Earth even colder?", "a": ["Ice reflects sunlight back to space", "Ice gives off heat", "Ice blocks volcanoes", "Ice adds oxygen to the air"], "why": "More ice means less sunlight is absorbed.", "div": "proterozoic"}], "questionsMainstreamHots": [{"q": "Why might many Cambrian animals have evolved hard shells and spines?", "a": ["They protected them from predators like Anomalocaris", "They helped them fly", "They kept them warm", "They let them make food from sunlight"], "why": "As predators appeared, prey with protective hard parts were more likely to survive.", "div": "paleozoic"}, {"q": "Why are fossil sites that preserve soft-bodied animals so valuable for studying Cambrian life?", "a": ["They preserve soft-bodied animals, not just hard parts", "They contain only plants", "They are the youngest rocks on Earth", "They contain dinosaur nests"], "why": "Most fossils are hard parts. These sites also preserve animals with no shells or bones.", "div": "paleozoic"}, {"q": "Why are trilobites useful for dating rock layers?", "a": ["Different species lived at different times, so each species marks a time span", "They are still alive today", "They lived only on land", "The same species is found in rocks of every age"], "why": "This is how index fossils work.", "div": "paleozoic"}, {"q": "Orthoceras could adjust the gas and liquid in the chambers of its shell. What did this help it do?", "a": ["Control its buoyancy (rise and sink in water)", "Breathe air", "Walk on land", "Make its own food"], "why": "Like the modern nautilus, it changed how much gas and liquid filled its chambers.", "div": "paleozoic"}, {"q": "Plants moved onto land before animals did. Why did this order make sense?", "a": ["Animals needed plants for food and shelter on land", "Plants needed animals to pollinate them", "Animals could not live where there were rocks", "Plants could only grow on dead animals"], "why": "Plants created food sources and habitats that land animals could use.", "div": "paleozoic"}, {"q": "Arandaspis had bony armor but no jaws. How did it most likely eat?", "a": ["It fed on small food particles near the sea floor", "It bit large prey", "It grazed on land plants", "It crushed shells with its teeth"], "why": "Without jaws, it could not bite or chew.", "div": "paleozoic"}, {"q": "Eusthenopteron's fin bones match the arm bones of tetrapods. What does this suggest?", "a": ["Tetrapod limbs evolved from the fins of lobe-finned fish", "Tetrapods evolved into fish", "Fish and tetrapods are not related", "All fish have arms"], "why": "Similar bones in fins and limbs show a shared ancestry.", "div": "paleozoic"}, {"q": "Ichthyostega had legs and lungs but still spent much of its time in water. What does this suggest?", "a": ["The move from water to land happened gradually", "Tetrapods lived fully on land from the start", "Ichthyostega could not breathe air", "Ichthyostega was a marine reptile"], "why": "Early tetrapods kept many links to water.", "div": "paleozoic"}, {"q": "Pederpes's feet pointed forward. Why is this important?", "a": ["Forward-pointing feet suited walking on land", "They helped it swim faster", "They helped it climb trees", "They helped it dig burrows"], "why": "Pederpes was an early tetrapod from Scotland.", "div": "paleozoic"}, {"q": "Why did so much coal form during the Carboniferous Period?", "a": ["Huge swamp forests grew, and their remains were buried and later became coal", "Volcanoes erupted coal", "Sea shells piled up and became coal", "Ice sheets froze the forests into coal"], "why": "Carboniferous means \"coal-bearing\".", "div": "paleozoic"}, {"q": "Meganeura and Arthropleura grew huge in the Carboniferous. Which condition most likely made this possible?", "a": ["High oxygen levels in the air", "A very cold climate", "A lack of plants", "Low oxygen levels"], "why": "More oxygen let arthropods supply a larger body.", "div": "paleozoic"}, {"q": "Hylonomus and Archaeothyris were both amniotes, but from different lines. What does this show?", "a": ["The reptile line and the mammal line had already split in the Carboniferous", "Mammals evolved from dinosaurs", "Reptiles evolved from mammals", "They were the same species"], "why": "Hylonomus was a sauropsid; Archaeothyris was a synapsid.", "div": "paleozoic"}, {"q": "During the Permian, the interior of Pangaea was hot and dry. Why would the middle of a huge continent be dry?", "a": ["It was far from the ocean, so little moist air reached it", "It was covered by glaciers", "It received no sunlight", "It was under the sea"], "why": "Moist ocean air loses its water before reaching far inland.", "div": "paleozoic"}, {"q": "Why do scientists study Permian therapsids to learn about mammals?", "a": ["Mammals evolved from therapsids, so they show how mammal features began", "Therapsids were the first dinosaurs", "Therapsids are still alive today", "Therapsids were birds"], "why": "Therapsids were advanced, mammal-like synapsids.", "div": "paleozoic"}, {"q": "The Ordovician ended with a glaciation. How could an ice age cause a mass extinction in the seas?", "a": ["Ocean temperatures and habitats changed faster than many species could adapt", "Ice crushed every animal on the sea floor", "Volcanoes stopped erupting", "Plants on land used up all the oxygen"], "why": "Rapid climate change destroyed habitats that many marine species depended on.", "div": "paleozoic"}, {"q": "Cladoselache had multi-pointed teeth for gripping prey, which it swallowed whole. What does this tell us?", "a": ["It grabbed prey and did not chew it into pieces", "It ate only plants", "It filtered plankton", "It crushed hard shells"], "why": "Gripping teeth hold prey; they are not built for chewing.", "div": "paleozoic"}, {"q": "Dunkleosteus had sharp, self-sharpening bony plates. What does this suggest?", "a": ["It was a predator that could cut through prey", "It ate only plants", "It used them to dig burrows", "It used them to fly"], "why": "Dunkleosteus was one of the top predators of Devonian seas.", "div": "paleozoic"}, {"q": "Prototaxites grew up to about 8 m tall, while plants like Cooksonia were only a few centimetres tall. What does this tell us?", "a": ["Early land plants were tiny; tall trees had not evolved yet", "Forests of tall trees were already common", "Land had no living things", "Cooksonia was a giant tree"], "why": "Prototaxites towered over the tiny early plants around it.", "div": "paleozoic"}, {"q": "Why did life first diversify in the oceans rather than on land?", "a": ["Life began in water, and land had no plants for food or shelter yet", "Land was too cold for everything", "There was no oxygen in the oceans", "Animals could not swim"], "why": "Land became livable for animals only after plants spread.", "div": "paleozoic"}, {"q": "Seymouria lived in the Permian, when vast areas were dry. Which feature would help it most?", "a": ["Legs suited to walking on dry land", "Gills for breathing water", "Fins for swimming", "Wings for flying"], "why": "Seymouria was a reptile-like tetrapod well adapted to dry land.", "div": "paleozoic"}, {"q": "Which two periods make up the \"Age of Amphibians\"?", "a": ["Carboniferous and Permian", "Silurian and Devonian", "Cambrian and Ordovician", "Devonian and Carboniferous"], "why": "The Paleozoic is divided into the Age of Invertebrates (Cambrian, Ordovician), the Age of Fishes (Silurian, Devonian) and the Age of Amphibians (Carboniferous, Permian).", "div": "paleozoic"}, {"q": "Life recovered slowly in the Early Triassic. Why?", "a": ["So many species had died in the Great Dying that ecosystems took millions of years to rebuild", "The Sun was too hot for life", "There were too many dinosaurs", "Asteroids kept striking Earth"], "why": "The Great Dying was the largest mass extinction in Earth's history.", "div": "mesozoic"}, {"q": "How can fossils of the same land animal, Lystrosaurus, be found in Africa, India and Antarctica?", "a": ["Those continents were joined as Pangaea when it lived", "It swam across the oceans", "Birds carried its eggs", "It lived on every continent at different times"], "why": "The continents later moved apart.", "div": "mesozoic"}, {"q": "Cymbospondylus reached about 17 m long only a few million years after the Great Dying. What does this show?", "a": ["Marine life recovered, and some reptiles quickly grew huge in the seas", "The Great Dying did not affect the oceans", "Ichthyosaurs were dinosaurs", "All animals became giants after extinctions"], "why": "It was one of the first giant ichthyosaurs.", "div": "mesozoic"}, {"q": "Why did tiny early mammals like Brasilodon hide in vegetation and small crevices?", "a": ["To avoid large predators", "To find snow", "To lay eggs in water", "To catch fish"], "why": "They lived among large reptiles and early dinosaurs.", "div": "mesozoic"}, {"q": "Ichthyosaurs were reptiles, yet they looked like dolphins. Why?", "a": ["A streamlined body helps any animal move fast through water", "Ichthyosaurs were related to dolphins", "Dolphins evolved from ichthyosaurs", "All reptiles look like dolphins"], "why": "Animals that live the same way can evolve similar shapes.", "div": "mesozoic"}, {"q": "What do Diplodocus's peg-like teeth suggest about how it ate?", "a": ["It stripped leaves from plants", "It hunted large prey", "It crushed bones", "It filtered plankton"], "why": "Diplodocus was a plant-eating sauropod.", "div": "mesozoic"}, {"q": "What was Stegosaurus most likely using its tail spikes for?", "a": ["Defense against predators", "Digging for water", "Catching fish", "Climbing trees"], "why": "Stegosaurus was a plant-eater that lived alongside predators like Allosaurus.", "div": "mesozoic"}, {"q": "Ophthalmosaurus had huge eyes. How did they help it?", "a": ["They helped it see in deep, dark water, where it hunted", "They helped it fly", "They helped it see at night on land", "They kept it warm"], "why": "It hunted squid-like animals in deep water.", "div": "mesozoic"}, {"q": "What do Allosaurus's sharp, serrated teeth tell us?", "a": ["It was a meat-eater that cut through flesh", "It ate only leaves", "It filtered water for food", "It ate only seeds"], "why": "Allosaurus was the top predator of Late Jurassic North America.", "div": "mesozoic"}, {"q": "Rhamphorhynchus had forward-pointing teeth in long jaws. What did it most likely catch?", "a": ["Fish", "Leaves", "Seeds", "Large dinosaurs"], "why": "Forward-pointing teeth help grab slippery prey.", "div": "mesozoic"}, {"q": "Edmontosaurus had hundreds of teeth packed together. What were they for?", "a": ["Grinding tough plants", "Cutting meat", "Catching fish", "Cracking bones"], "why": "Edmontosaurus was a duck-billed plant-eater.", "div": "mesozoic"}, {"q": "Triceratops lived alongside T. rex. How might its horns and frill have helped it?", "a": ["They may have helped protect it from predators", "They helped it fly", "They helped it swim", "They helped it dig burrows"], "why": "Triceratops was a plant-eater, while T. rex was a predator.", "div": "mesozoic"}, {"q": "T. rex had the strongest bite force of any land animal. What does this tell us?", "a": ["It could crush the bones of its prey", "It ate only soft fruit", "It filtered water", "It could not chew"], "why": "Its bite force was about 57 kN.", "div": "mesozoic"}, {"q": "What was Velociraptor most likely using its large sickle-shaped claw for?", "a": ["Attacking and holding prey", "Climbing tall trees", "Digging for roots", "Swimming"], "why": "Velociraptor was a meat-eating theropod.", "div": "mesozoic"}, {"q": "Pteranodon had a long, toothless beak and soared over a shallow sea. What did it eat?", "a": ["Fish", "Leaves", "Seeds", "Large dinosaurs"], "why": "A sea once covered central North America.", "div": "mesozoic"}, {"q": "Quetzalcoatlus was a giant flyer, but it probably hunted small animals while walking on all four limbs. What does this suggest?", "a": ["It found much of its food on the ground", "It never landed", "It lived only in the sea", "It ate only plants"], "why": "On the ground it stood about as tall as a giraffe.", "div": "mesozoic"}, {"q": "Flowering plants spread in the Cretaceous. How might this have affected animals?", "a": ["It gave animals new kinds of food, such as fruits, seeds and nectar", "It removed all food for animals", "It made the oceans freeze", "It had no effect on animals"], "why": "Flowering plants diversified and spread during the Cretaceous.", "div": "mesozoic"}, {"q": "A movie shows Velociraptor hunting near Brachiosaurus. What is wrong with this scene?", "a": ["They never met: Velociraptor lived in the Late Cretaceous, Brachiosaurus in the Late Jurassic", "Velociraptor was a plant-eater", "Brachiosaurus lived in the sea", "Nothing: they lived at the same time"], "why": "Velociraptor lived about 75–71 mya; Brachiosaurus about 154–150 mya.", "div": "mesozoic"}, {"q": "T. rex lived about 68–66 mya, and Stegosaurus lived about 155–148 mya. Which statement is true?", "a": ["T. rex lived closer in time to humans than to Stegosaurus", "T. rex and Stegosaurus fought each other", "Stegosaurus lived after T. rex", "Both lived in the Triassic"], "why": "At least 80 million years separate them, while 66 million years separate T. rex from us.", "div": "mesozoic"}, {"q": "How did hollow bones help a fast predator like Coelophysis?", "a": ["They made its body lighter, so it could move quickly", "They helped it breathe underwater", "They stored food", "They made it heavier for fighting"], "why": "Coelophysis was a slender, early theropod.", "div": "mesozoic"}, {"q": "The earliest dinosaurs, like Eoraptor (about 1 m) and Eodromaeus (about 1.2 m), were small. Later sauropods reached about 25 m. What does this show?", "a": ["Dinosaurs started small and later evolved into giants", "Dinosaurs got smaller over time", "All dinosaurs were the same size", "The first dinosaurs were the biggest"], "why": "Dinosaurs diversified greatly during the Mesozoic.", "div": "mesozoic"}, {"q": "Why was climbing trees an advantage for a small mammal like Purgatorius?", "a": ["Trees offered shelter from predators and food such as insects and fruit", "Trees were warmer than the ground in winter", "Trees protected it from asteroids", "Trees let it catch fish"], "why": "Purgatorius appeared shortly after the dinosaurs died out.", "div": "cenozoic"}, {"q": "Gastornis was once thought to be a predator, but it is now thought to have eaten mainly plants. What does this show?", "a": ["Scientists update their ideas when new evidence appears", "Scientists never change their minds", "Gastornis changed its diet during its life", "Fossils always tell the full story at once"], "why": "Science improves as new evidence is studied.", "div": "cenozoic"}, {"q": "Merychippus had high-crowned teeth. Why did these help it eat grass?", "a": ["Tough grass wears teeth down, so tall teeth lasted longer while grinding", "Tall teeth helped it bite meat", "Tall teeth helped it catch fish", "Grass is soft, so teeth do not matter"], "why": "Merychippus lived on the spreading grasslands of North America.", "div": "cenozoic"}, {"q": "Merychippus stood mostly on one large middle toe. How did this suit life on grasslands?", "a": ["It suited running on firm, open ground", "It helped it climb trees", "It helped it swim", "It helped it dig burrows"], "why": "Open grasslands have few places to hide, so speed helps escape predators.", "div": "cenozoic"}, {"q": "How did the Isthmus of Panama affect animals?", "a": ["Animals could move between North and South America", "It separated Asia from Africa", "It caused the dinosaurs to die out", "It stopped all animal movement"], "why": "Titanis reached North America from South America after it formed.", "div": "cenozoic"}, {"q": "Megalodon is known mainly from teeth rather than full skeletons. Why?", "a": ["Shark skeletons are made of cartilage, which rarely fossilizes, but teeth do", "Megalodon had no skeleton", "Its bones were collected and destroyed", "It lived only on land"], "why": "Hard teeth fossilize far more easily than cartilage.", "div": "cenozoic"}, {"q": "Livyatan and Megalodon lived at the same time, and both hunted whales. What does this suggest?", "a": ["They may have competed for the same large prey", "They were the same animal", "They never met", "They ate only plants"], "why": "Both were top predators in Neogene seas.", "div": "cenozoic"}, {"q": "Deinotherium probably used its downward-curving tusks to strip bark and pull down branches. What did it eat?", "a": ["Plants", "Fish", "Other elephants", "Insects only"], "why": "Deinotherium was a giant relative of elephants.", "div": "cenozoic"}, {"q": "Australopithecus walked upright but could still climb trees. What does this suggest about where it lived?", "a": ["In areas with both trees and open ground", "Only in deep oceans", "Only in deserts with no trees", "Only on ice sheets"], "why": "It used both ways of moving.", "div": "cenozoic"}, {"q": "How can scientists tell from Lucy's bones that she walked upright?", "a": ["From the shape of her hip and leg bones", "From the color of her bones", "From her footprints in the bones", "From her teeth only"], "why": "Hip and leg bones show how weight was carried.", "div": "cenozoic"}, {"q": "How did stone tools help Homo habilis?", "a": ["They helped it cut meat and process food", "They helped it fly", "They kept it warm", "They let it breathe underwater"], "why": "Homo habilis is linked with early stone tools.", "div": "cenozoic"}, {"q": "How would fire have helped Homo erectus?", "a": ["It gave warmth, light, protection and a way to cook food", "It helped it swim", "It helped it see in the dark only", "It had no use"], "why": "Homo erectus probably used fire.", "div": "cenozoic"}, {"q": "How did small ears help the woolly mammoth survive?", "a": ["Small ears lose less body heat in cold climates", "Small ears helped it hear better underwater", "Small ears helped it fly", "Small ears kept it cool in the desert"], "why": "Large ears, like those of African elephants, release heat.", "div": "cenozoic"}, {"q": "Neanderthals had stocky bodies. How did this help them?", "a": ["A stocky body loses less heat in cold climates", "It helped them run in hot deserts", "It helped them swim long distances", "It helped them climb trees"], "why": "Neanderthals lived in cold parts of Europe and western Asia.", "div": "cenozoic"}, {"q": "Smilodon had extremely long, saber-like canine teeth. What does this suggest?", "a": ["It ambushed and killed large animals", "It ate only grass", "It filtered water", "It ate only insects"], "why": "Smilodon was a saber-toothed cat.", "div": "cenozoic"}, {"q": "Which chain of events is correct for the Neogene?", "a": ["The climate cooled, grasslands spread, and grazing mammals thrived", "Grazing mammals appeared, which made the climate warmer", "Grasslands disappeared, so grazing mammals thrived", "The climate warmed, forests spread, and grazers died out"], "why": "Cooling favored grasslands and the animals that eat grass.", "div": "cenozoic"}, {"q": "Why do many people today carry a small amount of Neanderthal DNA?", "a": ["Some Neanderthals and modern humans had children together", "Neanderthals evolved into all modern humans", "People eat Neanderthal fossils", "Neanderthal DNA is found in all mammals"], "why": "Neanderthals were close relatives of modern humans.", "div": "cenozoic"}, {"q": "The last mammoths lived on Wrangel Island until about 4,000 years ago. What does this show?", "a": ["A small population survived on an isolated island long after most mammoths died out", "Mammoths lived only on islands", "Mammoths are still alive today", "Mammoths lived before the dinosaurs"], "why": "Isolated places can protect small populations for a time.", "div": "cenozoic"}, {"q": "Ice began forming on Antarctica during the Paleogene. What does this tell us about the Paleogene climate?", "a": ["It cooled after a very warm period", "It became hotter and hotter", "It had no seasons", "It stayed the same"], "why": "The cooling trend continued into the Neogene and Quaternary.", "div": "cenozoic"}, {"q": "Megatherium could rear up on its hind legs. Why?", "a": ["To reach leaves high in trees", "To catch fish", "To fly", "To dig burrows"], "why": "Megatherium was a plant-eating giant ground sloth.", "div": "cenozoic"}, {"q": "Purgatorius appeared shortly after the dinosaurs died out. Why is this timing important?", "a": ["It shows mammals began diversifying soon after the dinosaurs disappeared", "It shows mammals caused the extinction", "It shows primates lived with Brontosaurus", "It shows dinosaurs survived into the Cenozoic"], "why": "Empty habitats gave mammals room to diversify.", "div": "cenozoic"}], "questionsPoes": [{"q": "Rocks of the same age and type are found on the edges of North America, Europe and Africa, which are now far apart. What best explains this?", "a": ["They were once joined when Gondwana collided with North America and Europe to form Pangaea", "The rocks were carried by glaciers", "Volcanoes made the same rocks everywhere", "The oceans used to be dry land everywhere"], "why": "Pangaea formed near the end of the Paleozoic.", "div": "paleozoic"}, {"q": "Why are the Cambrian and Ordovician called the \"Age of Invertebrates\"?", "a": ["Animals without backbones, like trilobites and nautiloids, dominated the seas", "No animals had evolved yet", "Fish ruled the seas", "Invertebrates first moved onto land"], "why": "Vertebrates were still small and few.", "div": "paleozoic"}, {"q": "Which list shows the three Paleozoic \"ages\" in order, from oldest to youngest?", "a": ["Invertebrates, Fishes, Amphibians", "Fishes, Invertebrates, Amphibians", "Amphibians, Fishes, Invertebrates", "Invertebrates, Amphibians, Fishes"], "why": "Age of Invertebrates (Cambrian, Ordovician), Age of Fishes (Silurian, Devonian), Age of Amphibians (Carboniferous, Permian).", "div": "paleozoic"}, {"q": "A student uses the mnemonic \"Cambrian Ocean Swimmers Dive, Crawl, and Prosper\" to order fossils. A fossil comes from the \"Crawl\" period. What would she expect to find in the same rocks?", "a": ["Huge swamp forests and giant insects", "The first flowers and T. rex", "Ice age mammoths", "Only single-celled life"], "why": "\"Crawl\" stands for the Carboniferous.", "div": "paleozoic"}, {"q": "Which description fits the world during the Cambrian Period?", "a": ["Gondwana and smaller continents were in the Southern Hemisphere", "All continents were joined as Pangaea", "The continents were in their present positions", "Gondwana sat at the North Pole"], "why": "Pangaea formed much later, near the end of the Paleozoic.", "div": "paleozoic"}, {"q": "Trilobites had jointed legs and a hard exoskeleton. Which living animal would be the best model for how a trilobite grew?", "a": ["A crab, which must shed its exoskeleton to grow", "A fish, which grows its bones larger", "A snail, which adds to its shell", "A worm, which has no skeleton"], "why": "Arthropods, including trilobites, molt their exoskeletons to grow.", "div": "paleozoic"}, {"q": "Many trilobites were scavengers. What role did they play in Cambrian food webs?", "a": ["They fed on dead organisms and recycled nutrients", "They made food from sunlight", "They were the top predators", "They built coral reefs"], "why": "Scavengers eat dead remains.", "div": "paleozoic"}, {"q": "Hallucigenia had a soft body with stubby legs and spines. To understand how it moved, which living animal would scientists study?", "a": ["A velvet worm", "A squid", "A shark", "A sea star"], "why": "Velvet worms are close living relatives of Hallucigenia.", "div": "paleozoic"}, {"q": "Haikouichthys had no jaws. Which way of feeding fits this best?", "a": ["Filter feeding: straining tiny food from the water", "Biting large prey", "Grazing on land plants", "Crushing shells"], "why": "Haikouichthys may have been a filter feeder near the ocean floor.", "div": "paleozoic"}, {"q": "About 85% of marine species died out at the end of the Ordovician. If a reef had 200 species before the event, about how many would survive?", "a": ["About 30", "About 170", "About 100", "None"], "why": "15% of 200 is 30.", "div": "paleozoic"}, {"q": "Orthoceras had a chambered shell, tentacles and hunted prey. Which group of living animals is it most closely related to?", "a": ["Squids and octopuses", "Crabs and lobsters", "Sharks and rays", "Sea stars and sea urchins"], "why": "Orthoceras was a cephalopod, like squids and octopuses.", "div": "paleozoic"}, {"q": "A fossil fish has thick bony armor but no jaws. What would it most likely eat?", "a": ["Small food particles from the sea floor", "Large fish", "Land plants", "Hard-shelled clams it crushed"], "why": "Without jaws, early fish like Arandaspis could not bite.", "div": "paleozoic"}, {"q": "How did the climate change from the late Ordovician to the Silurian?", "a": ["It became milder as the Ordovician ice caps shrank", "It became a worldwide ice age", "It became so hot that the oceans dried up", "It did not change at all"], "why": "Gondwana stayed over the South Pole, but its ice caps shrank in the Silurian.", "div": "paleozoic"}, {"q": "As the Ordovician ice caps melted during the Silurian, what happened to sea level?", "a": ["It rose, flooding the edges of continents with shallow seas", "It fell, exposing the sea floor everywhere", "It stayed exactly the same", "The oceans froze solid"], "why": "Melting ice returns water to the oceans. Coral reefs spread in the warm, shallow Silurian seas.", "div": "paleozoic"}, {"q": "Guiyu oneiros had stronger fins than earlier fish. How did this help it?", "a": ["It could maneuver better through water", "It could walk on dry land", "It could fly", "It could dig into rock"], "why": "Guiyu also had thick scales and biting jaws.", "div": "paleozoic"}, {"q": "Why did Cooksonia grow near shallow waters?", "a": ["It had no roots or leaves and reproduced with spores that needed moisture", "It needed to eat fish", "It could only grow underwater", "It needed salt from the sea"], "why": "Early land plants depended on wet places.", "div": "paleozoic"}, {"q": "Prototaxites was not a tree. Why are its stands still called the first \"forests\"?", "a": ["Its towering, trunk-like columns were the largest organisms on land in its time", "It had leaves and seeds like trees", "It was a coral reef", "It was a conifer"], "why": "It formed a \"fungal forest\" of gigantic organisms up to about 8 m tall.", "div": "paleozoic"}, {"q": "Why do scientists still debate what Prototaxites really was?", "a": ["Its trunks of tightly packed tubes do not clearly match any living group", "No one has ever found its fossils", "It is still alive and hard to reach", "It looks exactly like a modern tree"], "why": "It was long thought to be a giant fungus, but the evidence is still debated.", "div": "paleozoic"}, {"q": "Kampecaris likely fed on decaying plant matter. What role did it play?", "a": ["It helped break down dead plants and recycle nutrients", "It made food from sunlight", "It was a top predator", "It pollinated flowers"], "why": "Animals that eat decaying matter return nutrients to the soil.", "div": "paleozoic"}, {"q": "In the Devonian, lungs began to develop in some bony fishes. How would lungs help a fish in shallow water?", "a": ["It could gulp air when the water held little oxygen", "It could swim faster", "It could see better", "It could live in deep water"], "why": "Shallow, warm water can run low on oxygen.", "div": "paleozoic"}, {"q": "Cladoselache was an agile hunter that fed on small bony fishes and arthropods. What was its role in the food web?", "a": ["A predator", "A producer", "A decomposer", "A filter feeder"], "why": "It hunted other animals in shallow tropical waters.", "div": "paleozoic"}, {"q": "Tiktaalik had both gills and lungs. What does this suggest about where it lived?", "a": ["Shallow water, where it could breathe in water and in air", "The deep ocean", "Dry deserts", "High mountains"], "why": "It propped itself up with its bony fins in shallow water.", "div": "paleozoic"}, {"q": "Why did huge swamp forests grow in the Carboniferous tropics?", "a": ["Warm, wet tropical conditions let trees grow and diversify", "The whole Earth was covered in ice", "There was no sunlight", "There were no plants yet"], "why": "Coal swamps grew in the warm, wet tropics, while ice sheets covered parts of southern Gondwana.", "div": "paleozoic"}, {"q": "How did the spread of Carboniferous forests change the atmosphere?", "a": ["Oxygen concentration increased", "Oxygen concentration decreased", "All carbon dioxide disappeared", "The air became mostly methane"], "why": "Trees release oxygen through photosynthesis.", "div": "paleozoic"}, {"q": "Archaeothyris and Hylonomus both lived in Nova Scotia in the Carboniferous. Why are they important together?", "a": ["They are the earliest known members of the two amniote lines: synapsids and sauropsids", "They are the first dinosaurs", "They are the first fish", "They are the same species"], "why": "Archaeothyris is the earliest known synapsid; Hylonomus is the earliest known sauropsid.", "div": "paleozoic"}, {"q": "Why was thicker, drier skin important for early reptiles like Hylonomus?", "a": ["It reduced water loss, so they could live away from water", "It helped them breathe underwater", "It helped them fly", "It helped them make food from sunlight"], "why": "Amphibians need moist surroundings; reptiles could move into dry places.", "div": "paleozoic"}, {"q": "How do scientists know that Arthropleura crawled across forest floors?", "a": ["Fossil trackways show its movement", "Its color is preserved", "Its DNA was recovered", "People saw it alive"], "why": "Trackways are trace fossils left by moving animals.", "div": "paleozoic"}, {"q": "Fossils studied in 2024 show Arthropleura had a head like a centipede's and a body like a millipede's. What does this tell us?", "a": ["It helps show how centipedes and millipedes are related", "It was a fish", "It could fly", "It lived in the deep sea"], "why": "Mixed features help scientists understand family relationships.", "div": "paleozoic"}, {"q": "Why don't land arthropods today grow as big as Arthropleura?", "a": ["Today's air has less oxygen, so their breathing tubes could not supply such a large body", "Today's plants are too small", "Arthropods today have no legs", "Today's climate is too warm"], "why": "Carboniferous air held more oxygen than it does today.", "div": "paleozoic"}, {"q": "How did conditions in the Permian differ from those in the Carboniferous?", "a": ["The Permian was drier, with vast deserts and less oxygen", "The Permian was wetter, with more swamps", "The Permian was covered by ice sheets", "The Permian had no land"], "why": "As Pangaea joined, the climate became drier.", "div": "paleozoic"}, {"q": "About 90% of marine organisms and 70% of land vertebrates died in the Great Dying. Which conclusion is correct?", "a": ["Sea life was hit even harder than life on land", "Land life was hit harder than sea life", "Only land animals died", "Most species survived"], "why": "90% is more than 70%.", "div": "paleozoic"}, {"q": "How could the Siberian Traps eruptions cause acid rain?", "a": ["Gases from the eruptions mixed with water in the air, forming acids", "Lava fell from the sky", "Ice melted into acid", "Plants released acids"], "why": "Acid rain was one of the effects that led to the Great Dying.", "div": "paleozoic"}, {"q": "Dimetrodon means \"two-measure teeth\". What does having teeth of different sizes connect it to?", "a": ["Mammals, its distant relatives, which also have different kinds of teeth", "Birds, which have no teeth", "Sharks, whose teeth are all the same", "Trilobites, which had no teeth"], "why": "Dimetrodon was a synapsid: part of the line that led to mammals.", "div": "paleozoic"}, {"q": "Biarmosuchus had long, saber-like canine teeth. What does this suggest?", "a": ["It was a carnivore that hunted small tetrapods", "It ate only leaves", "It filtered water for food", "It ate only fruit"], "why": "Biarmosuchus was one of the earliest carnivorous therapsids.", "div": "paleozoic"}, {"q": "Which sequence shows the mammal line correctly, from oldest to youngest?", "a": ["Early synapsids, then therapsids, then mammals", "Sauropsids, then dinosaurs, then mammals", "Therapsids, then early synapsids, then mammals", "Amphibians, then birds, then mammals"], "why": "Archaeothyris and Dimetrodon were early synapsids; Biarmosuchus was a therapsid.", "div": "paleozoic"}, {"q": "Which order shows how life moved onto land during the Paleozoic?", "a": ["Plants first, then arthropods, then early tetrapods", "Early tetrapods first, then plants, then arthropods", "Arthropods first, then early tetrapods, then plants", "All three moved onto land at the same time"], "why": "Animals followed the plants that gave them food and shelter.", "div": "paleozoic"}, {"q": "Why might hard body parts have evolved during the Cambrian?", "a": ["Predators appeared, and shells, spines and exoskeletons protected prey and gave support", "The climate became icy", "Animals began to fly", "Plants on land needed protection"], "why": "Hard parts also helped with moving and burrowing.", "div": "paleozoic"}, {"q": "A geologist finds the same trilobite species in rock layers on two different continents. What can she conclude?", "a": ["The two layers are about the same age", "The layers formed in the Cenozoic", "The layers formed on land", "Trilobites could fly between continents"], "why": "Trilobites are index fossils.", "div": "paleozoic"}, {"q": "Ichthyostega had seven toes on each hind foot, while most living tetrapods have five or fewer. What does this suggest?", "a": ["Early tetrapod limbs varied, and the five-toe pattern became standard later", "Ichthyostega was a fish", "All tetrapods today have seven toes", "Ichthyostega lived in the Cenozoic"], "why": "Early tetrapods often had more than five digits.", "div": "paleozoic"}, {"q": "Why do polished limestone countertops sometimes contain Orthoceras fossils?", "a": ["The limestone formed on the sea floor where Orthoceras lived", "Orthoceras lived in deserts", "Orthoceras was a land plant", "The fossils were carved by artists"], "why": "Limestone forms in the sea, so it often holds marine fossils.", "div": "paleozoic"}, {"q": "In the Devonian, Gondwana, North America and Europe were moving toward each other. What would this eventually lead to?", "a": ["The formation of Pangaea", "The breakup of Rodinia", "The opening of the Atlantic Ocean", "The formation of the Himalayas"], "why": "These landmasses joined to form Pangaea by the Permian.", "div": "paleozoic"}, {"q": "Trees began to appear in the Devonian. How might early trees have changed life on land?", "a": ["They gave shade, shelter and food, creating new habitats for animals", "They removed all oxygen from the air", "They made land too cold for life", "They had no effect on animals"], "why": "Plants build the habitats that land animals depend on.", "div": "paleozoic"}, {"q": "Which order shows how fish features appeared in the Paleozoic?", "a": ["Jawless armored fish, then jawed and bony fish, then fish with lungs and limb-like fins", "Fish with lungs, then jawed fish, then jawless fish", "Jawed fish, then jawless fish, then fish with lungs", "All appeared at the same time"], "why": "Jawless fish appeared in the Ordovician, bony fish in the Silurian, and lungs began developing in the Devonian.", "div": "paleozoic"}, {"q": "Which order of land plant evolution is correct?", "a": ["Liverwort-like plants, then vascular plants, then trees, then huge swamp forests", "Trees, then vascular plants, then liverwort-like plants", "Swamp forests, then trees, then liverwort-like plants", "Vascular plants, then liverwort-like plants, then swamp forests"], "why": "Ordovician, Silurian, Devonian, then Carboniferous.", "div": "paleozoic"}, {"q": "Why are the Silurian and Devonian called the \"Age of Fishes\"?", "a": ["Jawed and bony fishes diversified and dominated the seas", "Fish first moved onto land", "Fish were the only living things", "All fish went extinct"], "why": "Sharks, placoderms and bony fishes filled Devonian seas.", "div": "paleozoic"}, {"q": "Which best explains why dinosaurs came to dominate the land in the Jurassic?", "a": ["The Triassic–Jurassic extinction removed many of their competitors", "The Great Dying happened at the start of the Jurassic", "Mammals grew huge and protected dinosaurs", "An asteroid killed all other reptiles"], "why": "Many crocodile relatives that competed with dinosaurs died out at the end of the Triassic.", "div": "mesozoic"}, {"q": "Which pair of living animals are both archosaurs?", "a": ["Crocodiles and birds", "Lizards and snakes", "Frogs and salamanders", "Sharks and rays"], "why": "Archosaurs gave rise to crocodiles, pterosaurs and dinosaurs; birds are dinosaurs.", "div": "mesozoic"}, {"q": "A dinosaur trackway shows only toe prints, with no heel marks. What does this tell us?", "a": ["It walked on its toes (digitigrade)", "It walked on flat feet", "It was swimming", "It had no legs"], "why": "Most dinosaurs were digitigrade.", "div": "mesozoic"}, {"q": "Which trait is NOT one of the traits of Dinosauria?", "a": ["Legs that sprawl out to the sides", "Legs that extend beneath the body", "An open hip socket", "Walking mostly on the toes"], "why": "Sprawling legs are typical of lizards, not dinosaurs.", "div": "mesozoic"}, {"q": "A skull has a toothless bone at the tip of its lower jaw (a predentary bone). Which group does it belong to, and what did it most likely eat?", "a": ["An ornithischian that ate plants", "A theropod that ate meat", "A pterosaur that ate fish", "A sauropod that ate insects"], "why": "The predentary bone formed a beak for cropping plants.", "div": "mesozoic"}, {"q": "A dinosaur hip has its pubis pointing forward, at an angle to the ischium. Which kind of dinosaur could it be?", "a": ["A sauropod or a theropod (saurischian)", "Only an ornithischian", "A pterosaur", "An ichthyosaur"], "why": "In ornithischians, the pubis runs parallel to the ischium.", "div": "mesozoic"}, {"q": "Birds evolved from theropods. To which hip group do theropods belong?", "a": ["Saurischia (\"reptile-hipped\")", "Ornithischia (\"bird-hipped\")", "Neither: theropods are not dinosaurs", "Both groups equally"], "why": "Despite the name, birds did not come from the bird-hipped ornithischians.", "div": "mesozoic"}, {"q": "Which statement correctly describes Saurischia?", "a": ["It includes long-necked, plant-eating sauropods and two-legged, meat-eating theropods", "It includes only plant-eaters with beaks", "It includes pterosaurs and ichthyosaurs", "It includes only flying animals"], "why": "Sauropods and theropods are the two main saurischian groups.", "div": "mesozoic"}, {"q": "Modern corals first appeared in the Triassic. A rock contains modern-type coral fossils. What can you conclude about its age?", "a": ["It cannot be older than the Triassic", "It must be from the Cambrian", "It must be older than the Permian", "Nothing at all"], "why": "A fossil cannot be older than the first appearance of its group.", "div": "mesozoic"}, {"q": "The Triassic–Jurassic extinction removed about a quarter to a third of marine genera, while the Great Dying wiped out about 90% of marine organisms. Which conclusion is correct?", "a": ["The Great Dying was far more severe", "The Triassic–Jurassic extinction was more severe", "Both were equally severe", "Neither affected sea life"], "why": "The Great Dying was the largest mass extinction in Earth's history.", "div": "mesozoic"}, {"q": "As the Americas began breaking away from Africa, CAMP eruptions released huge amounts of carbon dioxide. How would this affect the climate?", "a": ["It would warm the planet and cause drastic climate swings", "It would cause a permanent ice age", "It would have no effect", "It would remove all oxygen instantly"], "why": "Carbon dioxide traps heat.", "div": "mesozoic"}, {"q": "Some of the earliest dinosaurs, like Eoraptor and Eodromaeus, were found in Argentina, and early relatives are found in North America too. What made this possible?", "a": ["The continents were joined as Pangaea, so animals could spread across them", "Dinosaurs swam across oceans", "Birds carried their eggs", "They evolved separately on each continent"], "why": "Pangaea was still joined in the Triassic.", "div": "mesozoic"}, {"q": "Eocursor had leaf-shaped teeth. What does this suggest?", "a": ["It was a herbivore", "It was a top predator", "It ate fish", "It ate insects only"], "why": "Eocursor was an early ornithischian from South Africa.", "div": "mesozoic"}, {"q": "Atychodracon lived in the sea and had flippers. Why is it still classified as a reptile and not a fish?", "a": ["It breathed air with lungs, had a reptile skeleton, and its flippers were modified limbs", "It had gills and fins", "It laid eggs in water like fish", "It had scales like fish"], "why": "Its ancestors were land reptiles that returned to the water.", "div": "mesozoic"}, {"q": "Shonisaurus looked like a dolphin, but it was a reptile. What explains the similar body shape?", "a": ["Convergent evolution: a streamlined shape suits fast swimming", "Shonisaurus was related to dolphins", "Dolphins evolved from Shonisaurus", "Both were fish"], "why": "Natural selection favored the same shape in unrelated animals that lived the same way.", "div": "mesozoic"}, {"q": "Why did ichthyosaurs give birth to live young at sea instead of laying eggs?", "a": ["Their flippers could not carry them onto land to lay eggs", "They had no lungs", "They lived in fresh water", "Their eggs floated away"], "why": "Shonisaurus and Ichthyosaurus gave birth to live young at sea.", "div": "mesozoic"}, {"q": "Eudimorphodon (Late Triassic) had many teeth, while Pteranodon (Cretaceous) had a toothless beak. What does this show?", "a": ["Pterosaurs changed and diversified over time", "They were the same animal", "Pterosaurs got teeth as they evolved", "Pteranodon was a bird"], "why": "Different diets and lifestyles led to different kinds of pterosaurs.", "div": "mesozoic"}, {"q": "Eudimorphodon had large fangs at the front and many small teeth behind. How might this help it catch fish?", "a": ["The fangs grabbed slippery prey, and the small teeth helped hold it", "The teeth helped it grind leaves", "The teeth helped it crack bones", "The teeth helped it dig"], "why": "It probably ate fish.", "div": "mesozoic"}, {"q": "Brasilodon was only about 12 cm long and lived alongside large reptiles and early dinosaurs. Why would being so small be an advantage?", "a": ["It needed little food and could hide in small spaces", "It could fight off large predators", "It could reach leaves high in trees", "It could swim across oceans"], "why": "Many early mammals were small and lived hidden lives.", "div": "mesozoic"}, {"q": "When Pangaea split into Laurasia (north) and Gondwana (south), animal groups on each side were separated. What would most likely happen over millions of years?", "a": ["The groups would evolve differently on each landmass", "All the animals would die", "The groups would stay exactly the same", "The groups would merge into one species"], "why": "Isolated populations change in different ways.", "div": "mesozoic"}, {"q": "The Jurassic had warm greenhouse conditions with no large ice caps. What would sea levels most likely be like?", "a": ["High, with shallow seas covering parts of the continents", "Very low, exposing the sea floor", "Frozen solid", "Exactly like today's"], "why": "With little water locked up as ice, sea levels stay high.", "div": "mesozoic"}, {"q": "How might a very long neck have helped Brontosaurus find enough food?", "a": ["It could reach a wide area of plants without moving its heavy body, saving energy", "It helped it catch fish", "It helped it run faster", "It helped it dig burrows"], "why": "Huge sauropods needed huge amounts of food.", "div": "mesozoic"}, {"q": "Stegosaurus had a beak. To which dinosaur group does this point?", "a": ["Ornithischia", "Saurischia", "Theropoda", "Pterosauria"], "why": "Ornithischians had a beak-like predentary bone.", "div": "mesozoic"}, {"q": "Why was reaching leaves high in trees an advantage for Brachiosaurus?", "a": ["It reduced competition with other plant-eaters", "It helped it hide from the sun", "It let it catch birds", "It kept it away from water"], "why": "Long front legs and a long neck reached food others could not.", "div": "mesozoic"}, {"q": "A new fossil walked on two legs and had hollow bones, sharp serrated teeth and clawed hands. In which group should it be placed?", "a": ["Theropods", "Sauropods", "Ornithischians", "Pterosaurs"], "why": "Theropods were mostly two-legged meat-eaters.", "div": "mesozoic"}, {"q": "Flowering plants diversified and modern insects appeared in the Cretaceous. How might the two be connected?", "a": ["Many insects feed on flowers and help pollinate them, so both could diversify together", "Insects destroyed all flowers", "Flowers ate insects", "They were not connected at all"], "why": "Living things that depend on each other can evolve together.", "div": "mesozoic"}, {"q": "In the Cretaceous, birds diversified while pterosaurs became fewer. Which idea does this support?", "a": ["Birds were taking over many of the ways of life pterosaurs once had", "Pterosaurs turned into birds", "Birds hunted all pterosaurs", "Pterosaurs could no longer fly"], "why": "Birds diversified, slowly replacing flying reptiles.", "div": "mesozoic"}, {"q": "A platypus lays eggs, a kangaroo raises its young in a pouch, and a dog's young develop inside the mother. When did these three groups appear?", "a": ["In the Mesozoic, during the Cretaceous", "In the Paleozoic", "In the Quaternary", "In the Archean"], "why": "Mammals diversified into monotremes, marsupials and placentals in the Cretaceous.", "div": "mesozoic"}, {"q": "The Chicxulub asteroid was only about 10–20 km wide, yet it caused a mass extinction. How?", "a": ["Debris blocked sunlight, plants died and food chains collapsed", "It hit every continent", "It made all the oceans boil away", "It changed Earth's orbit"], "why": "Its effects spread worldwide through the atmosphere.", "div": "mesozoic"}, {"q": "Archaeornithura belongs to the group that gave rise to modern birds. What does finding it in Early Cretaceous rocks tell us?", "a": ["Ancestors of modern birds already lived alongside other dinosaurs", "Modern birds appeared after humans", "Birds evolved from mammals", "Dinosaurs evolved from birds"], "why": "The bird lineage was already diversifying in the Cretaceous.", "div": "mesozoic"}, {"q": "Eomaia had long limbs for climbing and grasping. What does this suggest?", "a": ["It could climb plants and trees", "It lived in the deep sea", "It could fly long distances", "It burrowed deep underground"], "why": "Eomaia was a tiny early placental relative from China.", "div": "mesozoic"}, {"q": "T. rex is called a \"non-avian\" dinosaur. What does \"non-avian\" mean?", "a": ["It was a dinosaur that was not a bird", "It could fly", "It was not a dinosaur", "It lived in the sea"], "why": "Birds are avian dinosaurs.", "div": "mesozoic"}, {"q": "Plateosaurus walked on two legs, but later giant sauropods walked on four. What does this suggest?", "a": ["As sauropodomorphs grew huge, four legs supported their weight", "Sauropods could not walk", "Plateosaurus was a theropod", "Plateosaurus lived after the sauropods"], "why": "Plateosaurus was an early relative of the giant sauropods.", "div": "mesozoic"}, {"q": "Lystrosaurus became extremely common right after the Great Dying. What best explains this?", "a": ["Many competitors and predators had died out", "It was the largest predator of its time", "It could fly to new places", "It evolved after the dinosaurs"], "why": "It survived the end-Permian extinction and spread widely.", "div": "mesozoic"}, {"q": "Spinosaurus and modern crocodiles both have long, narrow snouts with cone-shaped teeth. What does this suggest?", "a": ["Both are suited to catching fish", "Spinosaurus was a crocodile", "Both ate only plants", "Both lived only on land"], "why": "Similar diets can lead to similar features.", "div": "mesozoic"}, {"q": "Velociraptor had feathers but was not a bird. What does this show?", "a": ["Feathers are not unique to birds; some theropod dinosaurs had them too", "Velociraptor could fly", "Feathers first appeared in mammals", "Velociraptor was a pterosaur"], "why": "Birds evolved from feathered theropods.", "div": "mesozoic"}, {"q": "Around what percentage of animal species went extinct in the K–Pg extinction?", "a": ["About 75%", "About 25%", "About 50%", "About 99%"], "why": "Around 75% of animal species, including the non-avian dinosaurs, went extinct.", "div": "mesozoic"}, {"q": "Archaeopteryx and the pterosaur Rhamphorhynchus are both found at Solnhofen, Germany. What does this show?", "a": ["Early birds and pterosaurs lived at the same time and place", "Archaeopteryx was a pterosaur", "Rhamphorhynchus was a bird", "They lived millions of years apart"], "why": "Both lived in the Late Jurassic.", "div": "mesozoic"}, {"q": "A shallow Atlantic sea appeared in the Jurassic. How has the Atlantic changed from then to today?", "a": ["It has widened as the continents kept moving apart", "It has disappeared", "It has frozen solid", "It has stayed the same size"], "why": "The Atlantic Ocean is still slowly widening today.", "div": "mesozoic"}, {"q": "Ornithischians were mostly herbivores. Which feature fits this diet?", "a": ["A beak-like predentary bone for cropping plants", "Serrated, blade-like teeth for cutting meat", "A sickle-shaped claw", "Hollow bones for flight"], "why": "Serrated teeth and sickle claws belong to theropods.", "div": "mesozoic"}, {"q": "India began colliding with Asia in the Paleogene, and it is still pushing north today. What would you expect is happening to the Himalayas?", "a": ["They are still slowly rising", "They are sinking into the sea", "They stopped changing millions of years ago", "They are moving south"], "why": "The collision continues, which is why the region has earthquakes.", "div": "cenozoic"}, {"q": "Tectonic and volcanic activity began building parts of the Philippines in the Paleogene. Why does the Philippines still have many earthquakes and active volcanoes?", "a": ["It sits where tectonic plates meet, and that activity continues", "It is far from any plate boundary", "Volcanoes stopped forming long ago", "Glaciers cause the earthquakes"], "why": "The same processes that built the islands are still active.", "div": "cenozoic"}, {"q": "Flowering plants dominated the land in the Paleogene. How might this have helped mammals and birds diversify?", "a": ["They provided more fruits, seeds and insects to eat", "They removed all food", "They made the land too cold", "They had no effect on animals"], "why": "New food sources open new ways of life.", "div": "cenozoic"}, {"q": "Purgatorius fed on insects and fruits. What type of consumer was it?", "a": ["An omnivore", "A herbivore", "A carnivore", "A producer"], "why": "Omnivores eat both plants and animals.", "div": "cenozoic"}, {"q": "Pakicetus lived along shores and its diet was likely mostly fish. How does this fit whale evolution?", "a": ["Early whale relatives already fed near water before later forms became fully aquatic", "Whales evolved from fish", "Pakicetus lived in the deep ocean", "Pakicetus was a shark"], "why": "Pakicetus was a land animal about the size of a wolf.", "div": "cenozoic"}, {"q": "Pakicetus is an early cetacean. Which living animal would share special ear-bone features with it?", "a": ["A dolphin", "A wolf", "A seal", "A shark"], "why": "Cetaceans include whales and dolphins; seals are not cetaceans.", "div": "cenozoic"}, {"q": "A farmer's carabao and Leptobos are both bovines. Which features would they most likely share?", "a": ["Horns and flat, grinding teeth for eating plants", "Sharp claws and canine teeth", "Flippers", "Feathers"], "why": "Bovines include cattle, bison and buffaloes such as the carabao.", "div": "cenozoic"}, {"q": "Australopithecus ate fruits, seeds and sometimes insects. What kind of consumer was it?", "a": ["An omnivore that could use many kinds of food", "A carnivore that ate only meat", "A producer", "A filter feeder"], "why": "Eating many foods helps an animal survive when one food is scarce.", "div": "cenozoic"}, {"q": "Lucy's brain was about the size of a chimpanzee's, but her hips and legs were built for walking upright. What does this tell us?", "a": ["Upright walking evolved before large brains", "Large brains evolved before upright walking", "Lucy could not walk", "Lucy was a chimpanzee"], "why": "Our ancestors walked on two legs for millions of years before their brains grew much bigger.", "div": "cenozoic"}, {"q": "Lucy was found in Ethiopia, and most early Australopithecus fossils come from East Africa. Where would scientists most likely search for even older hominin fossils?", "a": ["In older rock layers in Africa", "In ice in Antarctica", "In Cretaceous rocks", "In the deep ocean"], "why": "The human lineage began in Africa.", "div": "cenozoic"}, {"q": "Huge boulders from Canada are found in fields in the northern USA. What best explains this?", "a": ["Pleistocene ice sheets carried them south", "Rivers rolled them uphill", "Volcanoes threw them there", "People moved them recently"], "why": "Ice sheets covered much of North America and carried rocks with them.", "div": "cenozoic"}, {"q": "Changes in Earth's orbit repeat in regular cycles. What pattern would this produce in the Pleistocene?", "a": ["Ice ages that came and went many times", "One ice age that never ended", "No ice ages at all", "Ice only at the equator"], "why": "Ice sheets grew and retreated many times during the Pleistocene.", "div": "cenozoic"}, {"q": "About 65% of megafauna disappeared in the Pleistocene extinction. If 40 kinds of large animals lived in an area, about how many would survive?", "a": ["About 14", "About 26", "About 40", "None"], "why": "35% of 40 is 14.", "div": "cenozoic"}, {"q": "Overhunting and abrupt climate change most likely worked together in the Pleistocene extinction. Why would the two together be worse than either alone?", "a": ["Animals already stressed by changing habitats were less able to recover from hunting", "Hunting made the climate warmer", "Climate change made animals bigger", "They cancel each other out"], "why": "Several pressures at once make extinction more likely.", "div": "cenozoic"}, {"q": "Megatherium and Eremotherium were both ground sloths about as heavy as elephants. What does this show about ice age South America?", "a": ["It was home to many giant mammals", "It had no large animals", "Only reptiles lived there", "It was covered in ice"], "why": "Both were part of the ice age megafauna.", "div": "cenozoic"}, {"q": "How would using stone tools have given Homo habilis an advantage?", "a": ["Tools gave it energy-rich food like meat and marrow, which may have supported larger brains", "Tools helped it fly", "Tools let it breathe underwater", "Tools kept it from needing food"], "why": "Homo habilis used stone tools to butcher meat and process plants.", "div": "cenozoic"}, {"q": "Homo habilis fossils from East and South Africa are often found with simple stone tools and cut-marked animal bones. What does this suggest?", "a": ["Homo habilis used tools to butcher meat", "The tools were made by dinosaurs", "Homo habilis ate only plants", "The bones were cut by rivers"], "why": "Cut marks on bones show butchering.", "div": "cenozoic"}, {"q": "Homo erectus lived from about 1.9 million to 110,000 years ago. How does this compare with Homo sapiens so far?", "a": ["Homo erectus existed for much longer than Homo sapiens has", "Homo sapiens has existed longer", "They lasted the same time", "Homo erectus lived for only 300,000 years"], "why": "Homo sapiens has existed for about 300,000 years.", "div": "cenozoic"}, {"q": "Homo erectus had long legs and body proportions like ours. How would this help it spread from Africa into Asia?", "a": ["It could walk long distances efficiently", "It could swim across oceans", "It could climb trees faster", "It could fly"], "why": "Java Man shows Homo erectus reached Indonesia.", "div": "cenozoic"}, {"q": "Woolly mammoths ate shrubs, sedges and grasses of the cold steppe tundra. What happened to their food when forests spread as the ice age ended?", "a": ["It became scarcer", "It became more plentiful", "It stayed the same", "It turned into fish"], "why": "Climate change shrank the mammoth steppe.", "div": "cenozoic"}, {"q": "Which lists the periods of the Cenozoic from oldest to youngest?", "a": ["Paleogene, Neogene, Quaternary", "Neogene, Paleogene, Quaternary", "Quaternary, Neogene, Paleogene", "Paleogene, Quaternary, Neogene"], "why": "The Cenozoic is divided into the Paleogene, Neogene and Quaternary.", "div": "cenozoic"}, {"q": "Which is NOT one of the possible reasons scientists suggest for the disappearance of the Neanderthals?", "a": ["An asteroid impact", "Competition with modern humans", "Demographic collapse", "Assimilation through interbreeding"], "why": "The asteroid impact belongs to the K–Pg extinction, 66 million years ago.", "div": "cenozoic"}, {"q": "One possible reason Neanderthals disappeared is assimilation. Why does this mean they did not vanish completely?", "a": ["Some of their DNA lives on in people today", "Some Neanderthals are still alive", "Their tools are still used", "They turned into Homo erectus"], "why": "They interbred with Homo sapiens.", "div": "cenozoic"}, {"q": "Neanderthal populations were small and kept shrinking. Why are small populations at greater risk of extinction?", "a": ["A single disaster, disease or bad year can wipe them out", "Small populations always grow quickly", "Small populations never get sick", "Size does not matter"], "why": "This is called demographic collapse.", "div": "cenozoic"}, {"q": "Neanderthals lived about 400,000–40,000 years ago, and Homo sapiens appeared about 300,000 years ago. What does this tell us?", "a": ["The two species lived at the same time for a long period", "Neanderthals appeared after Homo sapiens died out", "They lived millions of years apart", "Neanderthals died out before Homo sapiens appeared"], "why": "They overlapped for about 260,000 years.", "div": "cenozoic"}, {"q": "Based on their dates, which pair of hominins could have lived at the same time?", "a": ["Homo erectus and Homo sapiens", "Australopithecus and Neanderthals", "Homo habilis and Neanderthals", "Lucy and Homo sapiens"], "why": "Homo erectus lived until about 110,000 years ago; Homo sapiens appeared about 300,000 years ago.", "div": "cenozoic"}, {"q": "A cave has tools from Homo habilis, Homo erectus and Homo sapiens in separate layers. Which tools would be in the deepest (oldest) layer?", "a": ["Homo habilis", "Homo erectus", "Homo sapiens", "All in the same layer"], "why": "Homo habilis appeared first, about 2.4 million years ago.", "div": "cenozoic"}, {"q": "What happened to the global climate after the very warm period about 56 million years ago?", "a": ["It started to cool, and ice sheets began to form in Antarctica", "It kept getting hotter until today", "It froze the whole Earth at once", "It stayed exactly the same"], "why": "Cooling continued through the Cenozoic.", "div": "cenozoic"}, {"q": "Why could large flightless birds like Gastornis thrive on land in the Paleogene?", "a": ["The large land dinosaurs were gone, leaving open niches", "There were no plants to compete with", "Mammals had gone extinct", "They could escape predators by flying"], "why": "Mammals and birds diversified rapidly after the K–Pg extinction.", "div": "cenozoic"}, {"q": "Marine fossils are found high in the Himalayas. What best explains this?", "a": ["Rocks that formed on the sea floor were pushed up when India collided with Asia", "The sea once reached the top of Mount Everest", "Birds carried the fossils there", "The fossils fell from space"], "why": "Colliding plates can lift sea-floor rocks into mountains.", "div": "cenozoic"}, {"q": "What do Smilodon, Megatherium and the woolly mammoth have in common?", "a": ["They were ice age megafauna that died out near the end of the Pleistocene", "They were all dinosaurs", "They all lived in the Paleogene", "They are all still alive today"], "why": "About 65% of all megafauna disappeared.", "div": "cenozoic"}, {"q": "Woolly mammoths were closely related to which living animals?", "a": ["Asian elephants", "Hippopotamuses", "Rhinoceroses", "Giraffes"], "why": "The woolly mammoth was an extinct species of elephant, closely related to Asian elephants.", "div": "cenozoic"}, {"q": "Australopithecus lived from about 4.2 to 1.9 million years ago. Which periods does this span?", "a": ["The Neogene and the Quaternary", "The Paleogene only", "The Cretaceous and the Paleogene", "The Quaternary only"], "why": "The Neogene ended and the Quaternary began 2.6 million years ago.", "div": "cenozoic"}, {"q": "Why did the Bering Land Bridge appear during ice ages?", "a": ["Water locked up in ice sheets lowered the sea level, exposing land", "Volcanoes built a new bridge", "Asia and North America collided", "An earthquake raised the sea floor"], "why": "When the ice melted, sea levels rose and covered the bridge again.", "div": "cenozoic"}, {"q": "Megatherium lived in South America until about 12,000 years ago. Which event matches its disappearance?", "a": ["The Pleistocene extinction", "The K–Pg extinction", "The Great Dying", "The Triassic–Jurassic extinction"], "why": "The Pleistocene extinction happened about 12,000–10,000 years ago.", "div": "cenozoic"}, {"q": "Java Man fossils were found in Indonesia. Which idea do they support?", "a": ["Homo erectus spread from Africa into Asia", "Humans first evolved in Indonesia", "Neanderthals lived in Indonesia", "Australopithecus lived in Asia"], "why": "Homo erectus was the first hominin known to leave Africa.", "div": "cenozoic"}, {"q": "Cave paintings and carved figures appear with Homo sapiens. What do they show?", "a": ["Complex culture and symbolic thinking", "That Homo sapiens could not use tools", "That Homo sapiens lived in the Mesozoic", "That art is older than life"], "why": "Art and culture set Homo sapiens apart.", "div": "cenozoic"}, {"q": "Neanderthals buried their dead and cared for the sick. What does this suggest?", "a": ["They had complex social behavior similar to ours", "They were not hominins", "They had no tools", "They lived alone"], "why": "They also made tools and used fire.", "div": "cenozoic"}, {"q": "Why does the Cenozoic world look most like today's?", "a": ["Modern geography and climate began to take shape", "Pangaea formed again", "The dinosaurs returned", "All the oceans dried up"], "why": "Continents moved close to their present positions.", "div": "cenozoic"}, {"q": "A rock layer contains Gastornis bones. Which other layer would be older than it: one with T. rex teeth or one with mammoth bones?", "a": ["The layer with T. rex teeth", "The layer with mammoth bones", "Both are younger", "Both are the same age"], "why": "T. rex lived in the Cretaceous, before the Cenozoic; mammoths lived in the Quaternary.", "div": "cenozoic"}, {"q": "Livyatan had teeth up to about 36 cm long. What does this suggest about its prey?", "a": ["It hunted large prey, such as other whales", "It ate only plankton", "It ate only seaweed", "It ate only small shrimp"], "why": "It was a huge predatory relative of the sperm whale.", "div": "cenozoic"}, {"q": "Titanis's ancestors came from South America, and it reached North America after the Isthmus of Panama formed. What does this show?", "a": ["New land connections let species migrate between continents", "Birds cannot cross land", "South America was always joined to Africa", "Titanis could fly across oceans"], "why": "Titanis was a flightless terror bird.", "div": "cenozoic"}, {"q": "What may have contributed to Megalodon's extinction about 3.6 million years ago?", "a": ["Cooling oceans and changes in its prey", "An asteroid impact", "Overhunting by humans", "The formation of Pangaea"], "why": "Humans had not yet appeared, and Pangaea had broken up long before.", "div": "cenozoic"}, {"q": "Leptobos was a grazer of open grasslands. Which Neogene change made its way of life possible?", "a": ["Global cooling, which spread grasslands", "The return of swamp forests", "The formation of Pangaea", "Rising oxygen levels"], "why": "Grazing mammals evolved and diversified as grasslands spread.", "div": "cenozoic"}, {"q": "Homo habilis is linked with early stone tools, while the later Homo erectus made hand axes. What does this suggest?", "a": ["Toolmaking became more advanced over time", "Toolmaking became simpler over time", "Only Homo habilis used tools", "Tools appeared only with Homo sapiens"], "why": "Hand axes are shaped more carefully than the earliest simple stone tools.", "div": "cenozoic"}, {"q": "Precambrian Time is the longest part of Earth's history, yet very few fossils come from it. Why?", "a": ["Most life was microscopic and soft, and the oldest rocks have been destroyed or changed", "There was no life at all in Precambrian Time", "Precambrian fossils are all buried in Antarctica", "Precambrian life was too large to fossilize"], "why": "Precambrian life was mostly single-celled, and few rocks from that time survive unchanged.", "div": "hadean"}, {"q": "Why did heavy iron sink to the core while lighter rock rose to form the crust?", "a": ["Denser materials sink and less dense materials rise in a molten Earth", "Iron is attracted to the Moon", "Rock is magnetic", "The crust formed first and the core later filled in"], "why": "This separation by density is called chemical differentiation.", "div": "hadean"}, {"q": "Why could chemical differentiation happen only while Earth was mostly molten?", "a": ["Materials could flow and separate by density", "Solid rock separates more easily than liquid", "Iron only exists in liquids", "The Moon pulled the iron down"], "why": "In a molten Earth, heavy iron could move downward.", "div": "hadean"}, {"q": "Zircon crystals about 4.4 billion years old were found in Western Australia. What do they tell us?", "a": ["Some solid rock already existed on Earth about 4.4 billion years ago", "Life already existed 4.4 billion years ago", "The Moon is older than the Sun", "Earth formed 4.4 million years ago"], "why": "They are the oldest known Earth minerals.", "div": "hadean"}, {"q": "If the Mars-sized body Theia had never struck the young Earth, what would most likely be different?", "a": ["Earth would not have the Moon we know", "Earth would have no oceans", "Earth would have no core", "Earth would have rings like Saturn"], "why": "The Moon is thought to have formed from this giant impact.", "div": "hadean"}, {"q": "Why is the name \"Hadean\" (from Hades, the underworld) fitting for this eon?", "a": ["Earth's surface was molten and constantly bombarded", "Earth was covered in ice", "Earth was full of dinosaurs", "Earth was covered in forests"], "why": "Conditions were too extreme for life.", "div": "hadean"}, {"q": "Abiogenesis means life arising from non-living matter. Which observation supports the idea that it happened at deep-sea hydrothermal vents?", "a": ["Vents release heat and energy-rich chemicals, and microbes thrive around vents today", "Vents are found only on land", "Vents produce oxygen-rich air", "Vents are covered in plants"], "why": "This is the hydrothermal vent hypothesis.", "div": "archean"}, {"q": "The first prokaryotes were anaerobic; aerobic bacteria and cyanobacteria came later. Which explains this order?", "a": ["There was almost no free oxygen at first, so the first cells had to live without it", "Oxygen was everywhere at first", "Aerobic bacteria need no oxygen", "Cyanobacteria evolved before any other life"], "why": "Oxygen built up only after cyanobacteria began photosynthesis.", "div": "archean"}, {"q": "How could aerobic bacteria already live in the Archean, when the air had almost no oxygen?", "a": ["They lived in small oxygen \"oases\" around cyanobacteria", "They made their own oxygen from rocks", "They did not need oxygen after all", "They lived in the upper atmosphere"], "why": "Cyanobacteria released oxygen nearby.", "div": "archean"}, {"q": "Which eon covers the formation of Earth's oceans and primitive atmosphere?", "a": ["Archean", "Hadean", "Proterozoic", "Phanerozoic"], "why": "The Archean (4.0 to 2.5 billion years ago) saw the oceans and a primitive atmosphere form, with almost no oxygen.", "div": "archean"}, {"q": "How could deep-sea hydrothermal vents provide what early life needed?", "a": ["They released heat, energy-rich chemicals and minerals, and the deep sea shielded them from harmful radiation", "They provided sunlight for photosynthesis", "They provided oxygen-rich air", "They provided plants to eat"], "why": "This supports the hydrothermal vent hypothesis.", "div": "archean"}], "questionsPoesSituational": [{"q": "A fossil from the Burgess Shale has five stalked eyes and a long, flexible snout ending in a claw. It is a relative of arthropods but not a true arthropod. Which animal is it?", "a": ["Opabinia", "Anomalocaris", "Hallucigenia", "Pikaia"], "why": "Opabinia was about 4–7 cm long.", "div": "paleozoic"}, {"q": "A rock layer contains jawless, armored fish, straight-shelled cephalopods and spores of simple plants similar to liverworts. There are no vascular plants. Which period does this layer most likely come from?", "a": ["Ordovician", "Cambrian", "Devonian", "Carboniferous"], "why": "Arandaspis, Orthoceras and the first simple land plants all point to the Ordovician.", "div": "paleozoic"}, {"q": "In coal swamp rocks, scientists find a fossil about 2.5 m long with many body segments and two pairs of legs on each segment. What is it?", "a": ["Arthropleura, a giant millipede relative", "Meganeura, a giant dragonfly relative", "A trilobite", "An early tetrapod"], "why": "Arthropleura is the largest known land arthropod.", "div": "paleozoic"}, {"q": "In coastal rocks about 385 million years old, scientists find a fish whose fin bones match the upper arm and forearm bones of tetrapods. What does this fossil show?", "a": ["How fins evolved into limbs", "That fish evolved from tetrapods", "That this fish could fly", "That this fish lived in the Cenozoic"], "why": "This describes Eusthenopteron, a lobe-finned fish.", "div": "paleozoic"}, {"q": "A rock layer contains sea scorpions, coral reefs and small land plants with simple stems and spore capsules at the tips of their branches. Which period does it most likely come from?", "a": ["Silurian", "Cambrian", "Permian", "Jurassic"], "why": "Eurypterids, spreading reefs and early vascular plants like Cooksonia mark the Silurian.", "div": "paleozoic"}, {"q": "A Devonian fossil fish is about 4 m long, covered in armor, and has sharp, self-sharpening bony plates instead of teeth. To which group does it belong?", "a": ["Placoderms (armored jawed fish)", "Sharks", "Jawless fish", "Ichthyosaurs"], "why": "This describes Dunkleosteus.", "div": "paleozoic"}, {"q": "Carboniferous rocks in Nova Scotia contain two small, lizard-like skeletons. Skeleton A's skull has one opening low behind each eye; Skeleton B's skull has no such opening. Which skeleton is an early member of the mammal line?", "a": ["Skeleton A: a synapsid like Archaeothyris", "Skeleton B: a synapsid like Hylonomus", "Both are early dinosaurs", "Neither: both are fish"], "why": "Synapsids have one lower opening behind each eye. Hylonomus, a sauropsid, had none.", "div": "paleozoic"}, {"q": "Permian rocks in Russia contain a meat-eater about 1.5 m long with long, saber-like canine teeth and a mammal-like skull. What is it most likely?", "a": ["An early therapsid, like Biarmosuchus", "An early dinosaur", "A shark", "A trilobite"], "why": "Biarmosuchus was one of the earliest carnivorous therapsids.", "div": "paleozoic"}, {"q": "In a cliff, a lower layer has many trilobites and synapsids. The layer directly above has very few fossils, and higher up are Early Triassic fossils of Lystrosaurus. What happened at the boundary?", "a": ["The Great Dying, linked to Siberian Traps volcanism", "The K–Pg asteroid impact", "The Ordovician glaciation", "The Cambrian explosion"], "why": "Trilobites disappeared in the end-Permian mass extinction.", "div": "paleozoic"}, {"q": "A ribbon-shaped fossil about 4–5 cm long from the Burgess Shale shows blocks of muscle along its body. To which group does it belong?", "a": ["Early chordates", "Trilobites", "Radiodonts", "Vascular plants"], "why": "This describes Pikaia, part of the group that includes vertebrates.", "div": "paleozoic"}, {"q": "A Cambrian fossil is slug-shaped, covered in scales and has two rows of tall spines. It grazed on the sea floor. To which group was it probably related?", "a": ["Molluscs", "Fish", "Insects", "Sharks"], "why": "This describes Wiwaxia.", "div": "paleozoic"}, {"q": "Rocks about 425 million years old in Scotland contain a small, millipede-like animal with many body segments. What does this fossil show?", "a": ["Animals were moving into land and freshwater habitats by the Silurian", "Animals reached land only in the Cenozoic", "Millipedes lived only in the deep ocean", "Dinosaurs had already appeared"], "why": "This describes Kampecaris, one of the oldest known myriapods.", "div": "paleozoic"}, {"q": "In Greenland, scientists find a Late Devonian four-limbed animal about 1.5 m long, with seven toes on each hind foot and lungs. What can they conclude?", "a": ["It was an early tetrapod that still spent much of its time in water", "It was a fully land-living reptile", "It was a fish with no limbs", "It was a flying reptile"], "why": "This describes Ichthyostega.", "div": "paleozoic"}, {"q": "Late Ordovician rocks show signs of glaciers, then signs of warming, along with a sharp drop in the number of marine fossil species. What best explains this?", "a": ["Rapid cooling and warming changed ocean habitats too fast for many species to adapt", "An asteroid struck the ocean", "Pangaea broke apart", "Humans overfished the seas"], "why": "About 85% of marine species went extinct.", "div": "paleozoic"}, {"q": "A Cambrian fossil about 30 cm long has a huge horseshoe-shaped head shield and rake-like frontal appendages. What kind of animal was it?", "a": ["A radiodont that sifted food from the sea floor", "A trilobite that burrowed", "A jawless fish", "An early land plant"], "why": "This describes Cambroraster from the Burgess Shale.", "div": "paleozoic"}, {"q": "Volcanic rocks about 201 million years old cover parts of the Americas and Africa. Rock layers from just after show about a quarter to a third of marine genera disappearing. What event do they record?", "a": ["The Triassic–Jurassic extinction", "The Great Dying", "The K–Pg extinction", "The Ordovician extinction"], "why": "CAMP eruptions released huge amounts of carbon dioxide.", "div": "mesozoic"}, {"q": "In the Yixian Formation of China, scientists find a tiny mammal, about 10 cm long, with long limbs for climbing and grasping, about 125 million years old. What is it most likely?", "a": ["Eomaia, an early placental relative", "Brasilodon, a Triassic mammal", "Purgatorius, an early primate relative", "A monotreme"], "why": "Eomaia means \"dawn mother\".", "div": "mesozoic"}, {"q": "In Late Triassic rocks in southern Brazil, scientists find a tiny animal about 12 cm long with mammal features. What is it most likely?", "a": ["One of the possible earliest true mammals, like Brasilodon", "An early dinosaur", "A pterosaur", "A marsupial"], "why": "The first true mammals appeared late in the Triassic.", "div": "mesozoic"}, {"q": "A Jurassic marine reptile about 4 m long has eyes about 23 cm across. How did it most likely live?", "a": ["It hunted in deep, dark water", "It lived in a desert", "It flew over the sea", "It ate plants on land"], "why": "This describes Ophthalmosaurus.", "div": "mesozoic"}, {"q": "Early Triassic rocks in Antarctica, just above Permian layers, contain a beaked, tusked plant-eater. The same species is found in Africa and India. What can scientists conclude?", "a": ["It survived the end-Permian extinction and lived across a joined Pangaea", "It lived after the dinosaurs died out", "Antarctica was always covered in ice", "It swam between the continents"], "why": "This describes Lystrosaurus.", "div": "mesozoic"}, {"q": "Thick chalk layers formed in warm seas contain a flying reptile with a long, toothless beak and a tall crest. Which period do these rocks most likely come from?", "a": ["Cretaceous", "Cambrian", "Carboniferous", "Quaternary"], "why": "This describes Pteranodon. Creta means chalk.", "div": "mesozoic"}, {"q": "A rock layer contains crocodile relatives, small two-legged early dinosaurs and early pterosaurs, but no birds and no flowering plants. Which period does it most likely come from?", "a": ["Triassic", "Cretaceous", "Paleogene", "Devonian"], "why": "Archosaurs diversified in the Triassic, before the first birds.", "div": "mesozoic"}, {"q": "A fossil site contains giant long-necked sauropods, early birds like Archaeopteryx, and forests of conifers, cycads and ferns. Which period is this?", "a": ["Jurassic", "Permian", "Neogene", "Cambrian"], "why": "Dinosaurs dominated the land, and the first birds appeared.", "div": "mesozoic"}, {"q": "Latest Cretaceous rocks in Texas contain a flying animal with a wingspan of about 10–11 m that stood as tall as a giraffe on the ground. To which group does it belong?", "a": ["Pterosaurs", "Birds", "Theropod dinosaurs", "Bats"], "why": "This describes Quetzalcoatlus.", "div": "mesozoic"}, {"q": "Cretaceous rocks contain three kinds of mammal fossils: one with eggshell nearby, one with pouch-supporting bones, and one whose young developed inside the mother. What does this show?", "a": ["Mammals had diversified into monotremes, marsupials and placentals", "Mammals had gone extinct", "Mammals evolved from birds", "All mammals laid eggs"], "why": "Mammals diversified into these three groups in the Cretaceous.", "div": "mesozoic"}, {"q": "Neogene marine rocks contain a triangular, serrated shark tooth about 18 cm long. No skeleton is found. Which animal does it most likely belong to?", "a": ["Megalodon", "Livyatan", "Cladoselache", "Dunkleosteus"], "why": "Megalodon is known mainly from fossil teeth.", "div": "cenozoic"}, {"q": "In Peru, scientists find a whale skull about 9 million years old with teeth up to about 36 cm long. What can they conclude?", "a": ["It was a predatory sperm whale relative that hunted other whales", "It was a filter-feeding whale", "It was a land mammal", "It was a giant shark"], "why": "This describes Livyatan.", "div": "cenozoic"}, {"q": "A pony-sized horse fossil from North America has three toes on each foot, with a large middle toe, and high-crowned teeth. What kind of habitat did it most likely live in?", "a": ["Grasslands", "Coral reefs", "Swamp forests", "Ice sheets"], "why": "This describes Merychippus.", "div": "cenozoic"}, {"q": "A fossil skull has tusks on its lower jaw that curve downward and backward. The animal stood about 4 m tall at the shoulder. What is it most likely?", "a": ["Deinotherium, an elephant relative that stripped bark and branches", "A woolly mammoth", "Megatherium", "Smilodon"], "why": "Deinotherium lived in Africa, Europe and Asia.", "div": "cenozoic"}, {"q": "North American rocks about 3 million years old contain a flightless bird about 2 m tall with a huge hoo
